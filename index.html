  const z=st.quiz;HARD=!!z.hard;
  if(z.mode){z.done=false;z.pick=null;
    while(z.queue.length){const k=z.queue.shift();const w=wrongs.find(x=>x.k===k);if(!w)continue;const p=P.find(x=>x.id===w.id);if(!p)continue;
      let q=null;if(z.mode==='new'){for(let i=0;i<10&&!q;i++)q=GEN[w.type](p);}
      if(!q)q=JSON.parse(JSON.stringify(w.q));q.p=p;q.type=w.type;q.wk=k;z.q=q;return}
    z.q=null;return}
  for(let t=0;t<40;t++){
    const p=weightedPick(z.pool);if(z.pool.length>1&&p===z.last)continue;
    const type=pick(z.types.flatMap(t=>t==='gram'?[t,t]:[t]));HARD=!!z.hard;let q=GEN[type](p);if(HARD&&type==='gram'){for(let g=0;g<25&&q&&!/개수|짝지은|옳은/.test(q.prompt);g++)q=GEN.gram(p);}if(HARD&&type==='word'){for(let g=0;g<10&&q&&!q.head;g++)q=GEN.word(p);}
    if(q){q.p=p;q.type=type;z.q=q;z.last=p;z.done=false;z.pick=null;return}
  }
  const p=z.pool[0];const q=GEN.title(p);q.p=p;q.type='title';z.q=q;z.done=false;z.pick=null;
}

const app=document.getElementById('app');
function render(){
  if(st.view==='home')renderHome();else if(st.view==='study')renderStudy();else renderQuiz();
}
function renderHome(){
  const tot=Object.values(stats).reduce((a,s)=>({c:a.c+s.c,t:a.t+s.t}),{c:0,t:0});
  const memoN=P.filter(p=>memo[p.id]).length;
  let h=`<header class="hero"><h1>올림포스 지문 암기</h1><p class="sub">김포고 1학년, 3·4·6·11·12·13강 홀수 지문 ${P.length}개</p>
  <div class="stats"><span>외운 지문<b>${memoN}/${P.length}</b></span><span>푼 문제<b>${tot.t}</b></span>${tot.t?`<span>정답률<b>${Math.round(tot.c/tot.t*100)}%</b></span>`:''}</div></header>`;
  h+=`<section class="panel"><h2>문제 풀기</h2><p class="sub">문제는 풀 때마다 새로 만들어져서 끝없이 나와요.</p>
  <p class="lbl">문제 유형</p><div class="chips">${TYPES.map(t=>`<button class="chip" data-act="type" data-k="${t.k}" aria-pressed="${cfg.types.includes(t.k)}">${t.name}</button>`).join('')}</div>
  <p class="lbl">범위</p><div class="chips">${UNITS.map(u=>`<button class="chip" data-act="unit" data-u="${u.u}" aria-pressed="${cfg.units.includes(u.u)}">${u.u}강</button>`).join('')}</div>
  <label class="tog hardtog"><input type="checkbox" data-act="hard" ${cfg.hard?'checked':''}>🔥 난이도 극상 (헷갈리는 선지만, 순서 4덩어리, 어법 개수·짝짓기)</label>
  <label class="tog"><input type="checkbox" data-act="weak" ${cfg.weak?'checked':''}>자주 틀린 지문을 더 자주 내기</label>
  <button class="btn" data-act="start" ${(!cfg.types.length||!cfg.units.length)?'disabled':''}>문제 풀기 시작</button></section>`;
  const wc={};wrongs.forEach(w=>{wc[w.type]=(wc[w.type]||0)+1});
  h+=`<section class="panel"><h2>오답 노트 <span class="muted" style="font-weight:400">${wrongs.length}문제</span></h2>${wrongs.length?`<p class="sub">${Object.entries(wc).map(([k,n])=>`${TN[k]} ${n}`).join(', ')}</p><p class="sub">다시 풀어서 맞히면 오답 노트에서 빠져요.</p><button class="btn" data-act="wrong" data-m="same">틀린 문제 그대로 다시 풀기</button><button class="btn" style="background:transparent;color:var(--blue);border:1px solid var(--blue)" data-act="wrong" data-m="new">같은 지문, 같은 유형 새 문제로 풀기</button><p style="margin:12px 0 0;text-align:right"><button class="link" data-act="wrongclear">오답 노트 비우기</button></p>`:`<p class="sub">틀린 문제는 여기에 자동으로 모여요.</p>`}</section>`;
  UNITS.forEach(u=>{
    h+=`<section class="unit"><h3>${u.u}강<span>${u.name}</span></h3>`;
    P.filter(p=>p.u===u.u).forEach(p=>{const s=stats[p.id];
      h+=`<button class="row${memo[p.id]?' done':''}" data-act="open" data-id="${p.id}"><span class="num">${p.n}</span><span><span class="k">${p.k}</span><span class="t">${esc(p.t)}</span></span><span class="acc">${memo[p.id]?'외움<br>':''}${s&&s.t?Math.round(s.c/s.t*100)+'%, '+s.t+'문제':''}</span></button>`;});
    h+='</section>';
  });
  h+=`<p style="margin-top:32px;text-align:center"><button class="link" data-act="reset">풀이 기록과 외움 표시 초기화</button></p><p class="sub" style="text-align:center;margin-top:8px">버전 14 (난이도 극상)</p>`;
  app.innerHTML=h;
}
function studyBody(p){
  if(st.mode==='full')return `<ol class="sents">${p.s.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
  if(st.mode==='ko')return `<p class="ko">${esc(p.ko)}</p>`;
  if(st.mode==='gram'){const g=p.g.slice().sort((a,b)=>a.i-b.i);let h='',pos=0,n=0;const li=[];g.forEach(o=>{if(o.i<pos)return;n++;h+=esc(p.en.slice(pos,o.i))+`<u class="gp">${esc(o.c)}</u><sup>${n}</sup>`;pos=o.i+o.len;li.push(`<li><b class="enl">${esc(o.c)}</b> <span class="muted">(✗ ${esc(o.alt)})</span><br>${esc(o.n)}</li>`);});h+=esc(p.en.slice(pos));return `<p>${h}</p><ol class="gl">${li.join('')}</ol>`;}
  const rnd=mulberry(st.seed*997+P.indexOf(p));const keys=new Set(p.w.map(w=>w[0].toLowerCase()));const open=st.revealAll?' open':'';
  return `<ol class="sents">`+p.s.map(sen=>'<li>'+sen.split(/(\s+)/).map(tok=>{
    if(!tok||/^\s+$/.test(tok))return tok;
    const m=tok.match(/^([^A-Za-z0-9]*)(.*?)([^A-Za-z0-9]*)$/);const core=m[2];
    if(!core)return esc(tok);
    let hide;
    if(st.mode==='initial')hide=core.length>=2;
    else{const r=rnd();hide=core.length>=2&&(st.hidePct===100||keys.has(core.toLowerCase())||(core.length>=3&&r<st.hidePct/100));}
    if(!hide)return esc(tok);
    const hid=st.mode==='initial'?`${esc(core[0])}<span class="blank" style="width:${((core.length-1)*.5).toFixed(2)}em"></span>`:`<span class="blank" style="width:${Math.max(1.4,core.length*.52).toFixed(2)}em"></span>`;
    return `${esc(m[1])}<span class="w${open}" role="button" tabindex="0"><span class="h">${hid}</span><span class="f">${esc(core)}</span></span>${esc(m[3])}`;
  }).join('')+'</li>').join('')+'</ol>';
}
function renderStudy(){
  const p=st.cur,i=P.indexOf(p);
  let h=`<div class="top"><button class="ghost" data-act="home">목록으로</button><span class="muted">${p.u}강 ${p.n}번</span></div>
  <h1 class="ph">${p.k}</h1><p class="t2">${esc(p.t)}</p>
  <div class="seg" role="group">${[['full','원문'],['initial','첫 글자'],['hide','가리기'],['gram','어법'],['ko','해석']].map(([k,n])=>`<button data-act="mode" data-k="${k}" aria-pressed="${st.mode===k}">${n}</button>`).join('')}</div>`;
  if(st.mode==='hide')h+=`<div class="chips sm">${[20,40,60,100].map(v=>`<button class="chip" data-act="pct" data-v="${v}" aria-pressed="${st.hidePct===v}">${v}% 가리기</button>`).join('')}<button class="chip" data-act="shuffle">다시 섞기</button></div>`;
  if(st.mode==='hide'||st.mode==='initial')h+=`<p class="hint">가려진 단어를 누르면 보여요. <button class="link" data-act="revealall">${st.revealAll?'다시 가리기':'전부 보기'}</button></p>`;
  h+=`<article class="panel${st.mode==='ko'?'':' psg'}">${studyBody(p)}</article>`;
  h+=`<div class="bar"><div class="in"><button class="ghost" data-act="prev" ${i===0?'disabled':''}>이전</button><button class="ghost${memo[p.id]?' on':''}" data-act="memo" aria-pressed="${!!memo[p.id]}">${memo[p.id]?'외웠어요 ✓':'외웠어요'}</button><button class="btn" data-act="quizone">이 지문 문제</button><button class="ghost" data-act="next" ${i===P.length-1?'disabled':''}>다음</button></div></div>`;
  app.innerHTML=h;
}
function renderQuiz(){
  const z=st.quiz,q=z.q;
  if(!q){app.innerHTML=`<div class="top"><button class="ghost" data-act="home">목록으로</button></div><section class="panel" style="text-align:center;padding:36px 16px"><h2>오답 노트 한 바퀴 끝!</h2><p class="sub">${z.t}문제 중 ${z.c}문제 맞혔고, ${z.cleared}문제를 오답 노트에서 뺐어요.</p><p class="sub">남은 오답 ${wrongs.length}개</p>${wrongs.length?`<button class="btn" data-act="wrong" data-m="same">남은 오답 다시 풀기</button>`:''}<button class="btn" style="background:transparent;color:var(--blue);border:1px solid var(--line)" data-act="home">목록으로</button></section>`;return}
  let h=`<div class="top"><button class="ghost" data-act="home">그만하기</button><span class="score">${z.mode?`오답 노트 ${z.t+(z.done?0:1)} / ${z.total}`:`맞힌 문제 ${z.c} / ${z.t}`}</span></div>
  <div class="qhead"><span class="qtype">${TN[q.type]}${z.hard?' <b class="hardb">🔥 극상</b>':''}</span><span>${z.done?`${q.p.u}강 ${q.p.n}번 지문`:(z.pool&&z.pool.length===1?`${q.p.u}강 ${q.p.n}번 지문`:'어느 지문일까요?')}</span></div>
  <p class="prompt">${q.prompt}</p><div class="psg">${q.body}</div>${q.head||''}
  <div class="opts">${q.opts.map((o,i)=>{let c='opt';if(z.done){if(i===q.ans)c+=' right';else if(i===z.pick)c+=' wrong';}
    return `<button class="${c}" data-act="pick" data-i="${i}" ${z.done?'disabled':''}><span class="cn">${CIRC[i]}</span><span class="${q.en?'en':''}">${q.type==='insert'||q.type==='irr'||q.nolabel?'':o}</span></button>`}).join('')}</div>`;
  if(z.done){const ok=z.pick===q.ans;
    h+=`<section class="fb ${ok?'ok':'no'}" id="fb"><p class="res">${ok?'정답이에요':'아쉬워요. 정답은 '+CIRC[q.ans]+'번'}</p>${z.mode?`<p class="muted" style="margin:-4px 0 10px">${ok?'오답 노트에서 뺐어요.':'오답 노트에 그대로 남겨 둘게요.'}</p>`:(ok?'':`<p class="muted" style="margin:-4px 0 10px">오답 노트에 저장했어요.</p>`)}${q.explain}<p style="margin:14px 0 0"><button class="link" data-act="openq">이 지문 외우러 가기</button></p></section>`;}
  h+=`<div class="bar"><div class="in"><button class="btn" data-act="nextq" ${z.done?'':'disabled'}>${z.mode&&!z.queue.length?'결과 보기':'다음 문제'}</button></div></div>`;
  app.innerHTML=h;
}
function startQuiz(pool,types){st.quiz={pool,types,c:0,t:0,last:null,hard:!!cfg.hard};nextQ();st.view='quiz';render();window.scrollTo(0,0);}
function openStudy(p){st.cur=p;st.view='study';st.revealAll=false;render();window.scrollTo(0,0);}

document.addEventListener('click',e=>{
  const w=e.target.closest('.w');if(w){w.classList.toggle('open');return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;const z=st.quiz;
  switch(a){
    case 'type':{const k=el.dataset.k;cfg.types=cfg.types.includes(k)?cfg.types.filter(x=>x!==k):[...cfg.types,k];store.set('oly-cfg',cfg);render();break}
    case 'unit':{const u=+el.dataset.u;cfg.units=cfg.units.includes(u)?cfg.units.filter(x=>x!==u):[...cfg.units,u];store.set('oly-cfg',cfg);render();break}
    case 'hard':cfg.hard=el.checked;store.set('oly-cfg',cfg);break;
    case 'weak':cfg.weak=el.checked;store.set('oly-cfg',cfg);break;
    case 'start':startQuiz(P.filter(p=>cfg.units.includes(p.u)),cfg.types.slice());break;
    case 'open':openStudy(P.find(p=>p.id===el.dataset.id));break;
    case 'home':st.view='home';render();window.scrollTo(0,0);break;
    case 'mode':st.mode=el.dataset.k;st.revealAll=false;render();break;
    case 'pct':st.hidePct=+el.dataset.v;st.revealAll=false;render();break;
    case 'shuffle':st.seed++;st.revealAll=false;render();break;
    case 'revealall':st.revealAll=!st.revealAll;render();break;
    case 'prev':{const i=P.indexOf(st.cur);if(i>0)openStudy(P[i-1]);break}
    case 'next':{const i=P.indexOf(st.cur);if(i<P.length-1)openStudy(P[i+1]);break}
    case 'memo':memo[st.cur.id]=!memo[st.cur.id];if(!memo[st.cur.id])delete memo[st.cur.id];store.set('oly-memo',memo);render();break;
    case 'quizone':startQuiz([st.cur],cfg.types.length?cfg.types.slice():TYPES.map(t=>t.k));break;
    case 'pick':{if(z.done)break;const i=+el.dataset.i;z.pick=i;z.done=true;z.t++;const ok=i===z.q.ans;if(ok)z.c++;
      if(z.mode){if(ok){wrongs=wrongs.filter(x=>x.k!==z.q.wk);z.cleared++;}saveWrongs();}
      else if(!ok){const q=z.q;wrongs.push({k:Date.now().toString(36)+Math.random().toString(36).slice(2,6),id:q.p.id,type:q.type,q:{prompt:q.prompt,body:q.body,opts:q.opts,ans:q.ans,explain:q.explain,head:q.head||'',en:!!q.en,nolabel:!!q.nolabel}});saveWrongs();}
      const s=stats[z.q.p.id]||{c:0,t:0};s.t++;if(ok)s.c++;stats[z.q.p.id]=s;store.set('oly-stats',stats);render();
      const fb=document.getElementById('fb');if(fb)fb.scrollIntoView({block:'nearest'});break}
    case 'wrong':{if(!wrongs.length)break;const q=shuffle(wrongs.map(w=>w.k));st.quiz={mode:el.dataset.m,queue:q,total:q.length,c:0,t:0,cleared:0,hard:!!cfg.hard};nextQ();st.view='quiz';render();window.scrollTo(0,0);break}
    case 'wrongclear':if(confirm('오답 노트를 모두 지울까요?')){wrongs=[];saveWrongs();render();}break;
    case 'nextq':nextQ();render();window.scrollTo(0,0);break;
    case 'openq':openStudy(z.q.p);break;
    case 'reset':if(confirm('풀이 기록과 외움 표시를 모두 지울까요?')){stats={};memo={};wrongs=[];saveWrongs();store.set('oly-stats',stats);store.set('oly-memo',memo);render();}break;
  }
});
document.addEventListener('keydown',e=>{const w=e.target.closest&&e.target.closest('.w');if(w&&(e.key==='Enter'||e.key===' ')){e.preventDefault();w.classList.toggle('open')}});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{})}
</script>
