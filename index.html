<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>올림포스 지문 암기</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B59C3">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4F9;--card:#FFFFFF;--ink:#18202E;--muted:#5B6679;--line:#D6DDE8;
  --blue:#2B59C3;--on-blue:#FFFFFF;--blue-soft:#E3EAFA;--mark:#FFE27A;
  --good:#1E8E5A;--good-soft:#E1F3E9;--bad:#C8413A;--bad-soft:#FBE6E4;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10151E;--card:#182030;--ink:#E7ECF4;--muted:#9AA6B8;--line:#2A3547;
    --blue:#8AAAFF;--on-blue:#0E1420;--blue-soft:#1F2C4A;--mark:rgba(255,214,70,.36);
    --good:#4CC38A;--good-soft:#16352A;--bad:#FF7F73;--bad-soft:#3B201F;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10151E;--card:#182030;--ink:#E7ECF4;--muted:#9AA6B8;--line:#2A3547;
  --blue:#8AAAFF;--on-blue:#0E1420;--blue-soft:#1F2C4A;--mark:rgba(255,214,70,.36);
  --good:#4CC38A;--good-soft:#16352A;--bad:#FF7F73;--bad-soft:#3B201F;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 110px}
.hero h1{font-size:28px;line-height:1.2;margin:10px 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;font-size:14px;color:var(--muted)}
.stats b{color:var(--ink);font-size:18px;margin-left:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin:18px 0}
.panel h2{font-size:18px;margin:0 0 4px}
.lbl{font-size:13px;color:var(--muted);margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chips.sm{margin:12px 0 0}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;margin:16px 0 4px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--blue)}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--blue);color:var(--on-blue);font-weight:700;padding:13px 16px;margin-top:14px;cursor:pointer;font-size:16px}
.btn:disabled{opacity:.4;cursor:default}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px}
.ghost:disabled{opacity:.35;cursor:default}
.ghost.on{background:var(--mark);border-color:transparent;color:var(--ink)}
.link{border:0;background:none;color:var(--blue);padding:0;cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.unit{margin-top:30px}
.unit h3{display:flex;align-items:baseline;gap:10px;margin:0 0 6px;font-size:20px}
.unit h3 span{font-size:14px;font-weight:400;color:var(--muted)}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 2px;background:none;border:0;border-top:1px solid var(--line);cursor:pointer}
.num{font-family:Literata,Georgia,serif;font-size:26px;font-weight:600;color:var(--blue);text-align:center;line-height:1.1;padding:2px 0}
.row.done .num{background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 92%,transparent 92%)}
.row .k{font-weight:500;display:block}
.row .t{font-size:13px;color:var(--muted);font-family:Literata,Georgia,serif;display:block;line-height:1.4}
.acc{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;line-height:1.4}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.muted{color:var(--muted);font-size:14px}
.ph{font-size:24px;line-height:1.3;margin:14px 0 2px;letter-spacing:-.01em}
.t2{font-family:Literata,Georgia,serif;color:var(--muted);margin:0 0 16px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:10px 4px;cursor:pointer;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);font-weight:700}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.psg,.sents{font-family:Literata,Georgia,serif;font-size:17px;line-height:1.8}
.psg p{margin:0 0 .7em}
.sents{padding-left:1.7em;margin:0}
.sents li{margin-bottom:.55em;padding-left:.2em}
.sents li::marker{color:var(--muted);font-size:13px;font-family:"IBM Plex Sans KR",sans-serif}
.ko{font-size:15.5px;line-height:1.85;margin:0}
.w{cursor:pointer;border-radius:3px}
.w .f{display:none}
.w.open .h{display:none}
.w.open .f{display:inline;background:var(--mark)}
.blank{display:inline-block;height:1em;border-bottom:2px solid var(--blue);vertical-align:-3px}
.qhead{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:8px}
.qtype{color:var(--blue);font-weight:700}
.score{font-weight:700}
.prompt{font-weight:700;font-size:17px;line-height:1.5;margin:8px 0 14px}
.given{border:1.5px solid var(--ink);border-radius:4px;padding:12px 14px;margin:0 0 14px}
.tag,.slot{font-family:"IBM Plex Sans KR",sans-serif;color:var(--blue);font-weight:700;font-size:15px}
.pair{font-weight:600;white-space:nowrap;background:var(--blue-soft);border-radius:4px;padding:1px 5px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;line-height:1.5}
.opt:disabled{cursor:default}
.opt .cn{flex:none;width:1.4em;color:var(--muted)}
.opt .en{font-family:Literata,Georgia,serif}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .cn{color:var(--good);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.headrow{border:0;background:none;padding:0 14px;color:var(--muted);font-size:13px;cursor:default}
.combo{flex:1;display:grid;grid-template-columns:repeat(var(--k),1fr);gap:8px;font-family:Literata,Georgia,serif}
.headrow .combo{font-family:"IBM Plex Sans KR",sans-serif}
.fb{margin-top:18px;border-radius:14px;padding:16px;background:var(--card);border:1px solid var(--line)}
.fb .res{font-weight:700;font-size:17px;margin:0 0 10px}
.fb.ok .res{color:var(--good)}
.fb.no .res{color:var(--bad)}
.fb .psg{font-size:16px}
.fb details{margin-top:12px;font-size:14px}
.fb summary{cursor:pointer;color:var(--blue)}
.hl{background:linear-gradient(transparent 48%,var(--mark) 48%)}
.strike{text-decoration:line-through;text-decoration-color:var(--bad);opacity:.7}
.exh{font-weight:600;margin:0 0 8px}
.enl{font-family:Literata,Georgia,serif}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:8px}
.bar .btn{margin:0;flex:1.4;padding:10px 12px;font-size:15px}
.bar .ghost{flex:1;padding:10px 6px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const P = [
{u:3,n:1,k:'수업 시작 루틴의 힘',t:'Make the Most of the First Minutes of Class',x:['Why Students Are Always Late for Class','Creative Materials That Motivate Students'],w:[['Inefficient','Efficient'],['overlook','notice'],['little','much'],['waste','save'],['tone','speed'],['transitions','conflicts']],
en:`Inefficient teachers overlook the potential power of the opening minutes of class. Often, if students are quiet enough and if there are many pressing demands on a teacher’s time at that moment, more than ten minutes can disappear before class starts. It’s no wonder that students are late for class; they have little reason to be on time. You can use the first ten minutes to get your class off to a great start, or you can choose to waste this time. The first minutes set the tone for the rest of the class. If you are prepared for class and have taught your students an opening routine, they can use this brief time to make mental and emotional transitions from the last class or subject and prepare to focus on learning new material. In summary, you should establish an opening routine to develop your class with an effective start.`,
ko:`비효율적인 교사들은 수업 시작 몇 분의 잠재적인 힘을 간과한다. 흔히, 학생들이 충분히 조용하고 그 순간 교사의 시간에 대한 긴급한 요구가 많으면, 수업이 시작되기 전에 10분 이상이 사라질 수 있다. 학생들이 수업에 늦는 것은 놀라운 일이 아닌데, 그들은 제시간에 올 이유가 거의 없다. 당신은 훌륭한 시작으로 당신의 수업을 출발시키도록 첫 10분을 사용하거나 이 시간을 낭비하도록 선택할 수 있다. 첫 몇 분이 나머지 수업의 분위기를 설정한다. 당신이 수업 준비가 되어 있고 시작 루틴을 학생들에게 가르쳤다면, 그들은 지난 수업 또는 과목으로부터 정신적, 감정적으로 전환하고 새로운 자료를 배우는 것에 집중하려고 준비하기 위해 이 짧은 시간을 사용할 수 있다. 요약하자면, 효과적인 출발로 수업을 전개하기 위한 시작 루틴을 마련해야 한다.`},
{u:3,n:3,k:'집안일을 운동 기회로',t:'Turn Household Chores into Mini Workouts',x:['Why Chores Should Be Shared by the Whole Family','The Dangers of Exercising Too Intensely'],w:[['packed','free'],['inevitable','avoidable'],['obligatory','voluntary'],['seize','ignore'],['improve','harm']],
en:`For many of us, making time for exercise is a continuing challenge. Between work commitments and family obligations, it often feels like there’s no room in our packed schedules for a dedicated workout. But what if the workout came to you, right in the midst of your daily routine? That’s where the beauty of integrating mini-exercises into household chores comes into play. Let’s be realistic; chores are inevitable. Whether it’s washing dishes or taking out the trash, these tasks are an essential part of daily life. But rather than viewing chores as purely obligatory activities, why not seize these moments as opportunities for physical activity? For instance, practice squats or engage in some wall push-ups as you wait for your morning kettle to boil. Incorporating quick exercises into your daily chores can improve your health.`,
ko:`우리 중 다수에게 운동할 시간을 내는 것은 계속되는 도전이다. 업무에 대한 전념과 가족 의무 사이에서, 우리의 빡빡한 일정들에는 운동에 전념할 여유가 없는 것처럼 종종 느껴진다. 그러나 만약 여러분의 일상 바로 한가운데에서 운동이 여러분을 찾아온다면 어떨까? 그것이 바로 간단한 운동을 집안일에 통합시키는 아름다움이 작동하기 시작하는 지점이다. 현실적이 되자. 집안일은 불가피하다. 그것이 설거지하는 것이든 쓰레기를 내다 버리는 것이든지 간에, 이런 일들은 일상생활의 필수적인 부분이다. 하지만 집안일을 순전히 의무적인 행위로 간주하기보다는, 이런 순간들을 신체 활동을 위한 기회로 잘 이용하는 것이 어떨까? 예를 들어, 여러분의 아침 주전자가 끓기를 기다리면서 스쾃을 연습하거나 벽에 대고 하는 팔 굽혀 펴기 몇 개를 시작해 보라. 짧은 운동을 일상적인 집안일에 포함하는 것이 건강을 향상시킬 수 있다.`},
{u:3,n:5,k:'어려움을 긍정적인 진술로 바꾸기',t:'Rewrite Your Challenges as Positive Statements',x:['Learn Magic Tricks to Build Confidence','Face Every Challenge Without Running Away'],w:[['positive','negative'],['struggle','succeed'],['witness','doubt'],['shift','pause'],['powerful','helpless']],
en:`Magic is what we all wish for to happen in our life. Do you love the movie Cinderella like me? Well, in real life, you can also create magic. Here’s the trick. Write down all the real-time challenges that you face and deal with. Just change the challenge statement into positive statements. Let me give you an example here. If you struggle with getting up early in the morning, then write a positive statement such as “I get up early in the morning at 5:00 am every day.” Once you write these statements, get ready to witness magic and confidence. You will be surprised that just by writing these statements, there is a shift in the way you think and act. Suddenly you feel more powerful and positive.`,
ko:`마법은 우리 모두가 자신의 삶에서 일어나기를 바라는 바이다. 여러분도 나처럼 ‘신데렐라’ 영화를 사랑하는가? 그러면, 실제 삶에서, 여러분도 마법을 만들 수 있다. 여기 그 요령이 있다. 여러분이 직면하여 처리하는 모든 실시간의 어려움을 적으라. 그 어려움에 관한 진술을 그저 긍정적인 진술로 바꾸라. 여기서 여러분에게 한 예시를 제시하겠다. 만약 여러분이 아침 일찍 일어나는 것에 어려움을 겪는다면, 그러면 ‘나는 매일 일찍 아침 5시에 일어난다.’와 같은 긍정적인 진술을 쓰라. 일단 여러분이 이러한 진술을 적는다면, 마법과 자신감을 목격할 준비를 하라. 여러분은 단지 이러한 진술을 적음으로써 여러분이 생각하고 행동하는 방식에 변화가 있다는 것에 놀랄 것이다. 어느 순간 여러분은 더 강력하고 긍정적이라고 느끼게 된다.`},
{u:3,n:7,k:'행동으로 보여 주는 삶의 모범',t:'Children Learn Values from What You Do, Not What You Say',x:['The Power of Praise in Raising Children','Why Comparing Children Is Harmful'],w:[['share','reject'],['tempting','boring'],['action','words'],['respect','ignore'],['compassion','indifference']],
en:`We are always teaching our children something by our words and our actions. They learn from seeing. They learn from hearing and from overhearing. Children share the values of their parents about the most important things in life. Our priorities and principles and our examples of good behavior can teach our children to take the high road when other roads look tempting. Remember that children do not learn the values that make up strong character simply by being told about them. They learn by seeing the people around them act on and uphold those values in their daily lives. Therefore show your child good examples of life by your action. In our daily lives, we can show our children that we respect others. We can show them our compassion and concern when others are suffering, and our own self-discipline, courage and honesty as we make difficult decisions.`,
ko:`우리는 항상 우리 자녀에게 말과 행동으로 무언가를 가르치고 있다. 그들은 보는 것으로부터 배운다. 그들은 듣거나 ‘우연히 듣는 것’으로부터 배운다. 아이들은 인생에서 가장 중요한 것에 대해 그들 부모의 가치를 공유한다. 우리의 우선순위와 원칙 그리고 훌륭한 행동에 대한 본보기는 우리 자녀에게 다른 길이 유혹적으로 보일 때 올바른 길로 가도록 가르칠 수 있다. 아이들은 확고한 인격을 구성하는 가치를 단순히 그것에 대해 ‘들음’으로써 배우지 않는다는 것을 기억하라. 그들은 그들 주변 사람들이 그들의 일상생활에서 그러한 가치를 좇아 ‘행동하’고 ‘유지하는’ 것을 봄으로써 배운다. 그러므로 여러분의 자녀에게 여러분의 행동으로 삶의 좋은 모범을 보이라. 우리 일상생활에서, 우리는 우리 자녀에게 우리가 타인을 존중하는 것을 보여 줄 수 있다. 우리는 그들에게 타인이 괴로워할 때 우리의 연민과 걱정을, 그리고 우리가 어려운 결정을 할 때 우리 자신의 자제력, 용기 그리고 정직을 보여 줄 수 있다.`},
{u:3,n:9,k:'에너지 정점 시간 활용',t:'Work with Your Energy Peaks',x:['Divide Your Work Evenly Throughout the Day','Start Every Morning with Meditation'],w:[['constant','varying'],['demanding','routine'],['observe','ignore'],['different','alike'],['peak','slump']],
en:`It is difficult for any of us to maintain a constant level of attention throughout our working day. We all have body rhythms characterised by peaks and valleys of energy and alertness. You will achieve more, and feel confident as a benefit, if you schedule your most demanding tasks at times when you are best able to cope with them. If you haven’t thought about energy peaks before, take a few days to observe yourself. Try to note the times when you are at your best. We are all different. For some, the peak will come first thing in the morning, but for others it may take a while to warm up.`,
ko:`우리 중 누구라도 근무일 내내 일정한 수준의 주의 집중을 유지하기는 어렵다. 우리 모두는 에너지와 기민함의 정점과 저점을 특징으로 하는 신체 리듬을 가지고 있다. 가장 힘든 작업을 그것을 가장 잘 처리할 수 있는 시간에 하도록 계획을 잡으면, 더 많은 것을 이루고, 혜택으로 자신감을 느낄 것이다. 만약 전에 에너지 정점에 관해 생각해 본 적이 없다면, 며칠 동안 자신을 관찰하라. 자신이 가장 좋은 상태일 때를 알아차리도록 노력하라. 우리는 모두 다르다. 어떤 사람에게는 정점이 아침에 제일 먼저 오지만, 다른 사람에게는 준비되는 데 얼마간의 시간이 걸릴 수도 있다.`},
{u:3,n:11,k:'말할 때 더 많은 단어가 필요한 이유',t:'Why Speakers Need More Words Than Writers',x:['The Secret of Concise Writing','Slow Down When You Give a Speech'],w:[['more','fewer'],['replay','pause'],['distracted','focused'],['miss','catch'],['longer','shorter']],
en:`Experts on writing say, “Get rid of as many words as possible.” Each word must do something important. If it doesn’t, get rid of it. Well, this doesn’t work for speaking. It takes more words to introduce, express, and adequately elaborate an idea in speech than it takes in writing. Why is this so? While the reader can reread, the listener cannot rehear. Speakers do not come equipped with a replay button. Because listeners are easily distracted, they will miss many pieces of what a speaker says. If they miss the crucial sentence, they may never catch up. This makes it necessary for speakers to talk longer about their points, using more words on them than would be used to express the same idea in writing.`,
ko:`글쓰기 전문가들은 “가능한 한 많은 단어를 삭제하라.”고 말한다. 각 단어는 무언가 중요한 일을 해야 한다. 만일 그러지 않는다면 그것을 삭제하라. 자, 이 방법은 말하기에서는 효과가 없다. 말을 할 때는 아이디어를 소개하고, 표현하며, 적절히 부연 설명하는 데 글을 쓸 때 필요한 것보다 더 많은 단어가 필요하다. 이것은 왜 그러한가? 독자는 글을 다시 읽을 수 있으나 청자는 다시 들을 수 없다. 화자는 반복 재생 버튼을 갖추고 있지 않다. 청자들은 쉽게 주의력이 흐려지기 때문에 화자가 말하는 것 중 많은 부분을 놓칠 것이다. 그들이 중요한 문장을 놓친다면, 절대로 따라잡을 수 없을 것이다. 이것은 같은 아이디어를 표현하기 위해 글을 쓸 때 사용될 단어 수보다 그것들(요점)에 대해 더 많은 단어를 사용하여 화자들이 그들의 요점에 대해 ‘더 길게’ 말할 필요가 있게 한다.`},

{u:11,n:1,k:'가젤이 길들여지지 않은 이유',t:'Why Gazelles Were Never Domesticated',x:['How Herds Protect Animals from Predators','The First Domesticated Animals of the Fertile Crescent'],w:[['nervous','calm'],['difficult','easy'],['panic','relax'],['frequently','rarely'],['blindly','carefully']],
en:`Big mammalian herbivore species react to danger from predators or humans in different ways. Some species are nervous, fast, and programmed for instant flight when they perceive a threat. Other species are slower, less nervous, seek protection in herds, stand their ground when threatened, and don’t run until necessary. Naturally, the nervous species are difficult to keep in captivity. If put into an enclosure, they are likely to panic, and either die of shock or hit themselves repeatedly to death against the fence in their attempts to escape. That’s true, for example, of gazelles, which for thousands of years were the most frequently hunted game species in some parts of the Fertile Crescent. There is no mammal species that the first settled peoples of that area had more opportunity to domesticate than gazelles. But no gazelle species has ever been domesticated. Just imagine trying to herd an animal that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour!`,
ko:`대형 포유류의 초식동물 종은 포식자나 인간으로부터의 위험에 대해 다른 방식으로 반응한다. 어떤 종들은 그들이 위협을 감지할 때 긴장하고, 빠르고, 즉각적인 도망을 하도록 프로그램화되어 있다. 다른 종들은 더 느리고, 덜 긴장하고, 무리 속에서 보호를 찾고, 위협을 받았을 때 그들의 자리를 지키고 필요할 때까지 도망가지 않는다. 자연스럽게, 긴장하는 동물 종들은 갇힌 상태를 유지하기 어렵다. 만약 우리 안에 넣어지면, 그들은 패닉에 빠지게 될 가능성이 있고 충격으로 죽거나 탈출하려는 시도로 그들 자신을 반복적으로 울타리에 부딪혀 죽을 가능성이 있다. 예를 들어, 이것은 가젤에 해당하는데 이들은 수천 년 동안 비옥한 초승달 지대의 일부 지역에서 가장 빈번하게 사냥된 사냥감 종이었다. 그 지역에 처음으로 정착한 인간들이 가젤보다 길들일 기회가 더 많았던 포유류는 없다. 그러나 어떤 가젤 종도 지금까지 길들여진 적이 없다. 도망가고, 자신을 맹목적으로 벽에 부딪치고, 거의 30피트까지 뛰어오를 수 있고, 시속 50마일의 속도로 달릴 수 있는 동물을 몰고 다니려고 애쓰는 것을 상상해 보라!`},
{u:11,n:3,k:'디지털 은유와 언어적 은유의 차이',t:'Digital Metaphors vs. Linguistic Metaphors',x:['Shakespeare’s Influence on Modern Technology','Why Every Metaphor Should Be Easy to Understand'],w:[['passive','active'],['active','passive'],['forcefully','gently'],['obvious','hidden']],
en:`Digital technologies are essentially related to metaphors, but digital metaphors are different from linguistic ones in important ways. Linguistic metaphors are passive, in the sense that the audience needs to choose to actively enter the world proposed by metaphor. In the Shakespearean metaphor “time is a beggar,” the audience is unlikely to understand the metaphor without cognitive effort and without further engaging Shakespeare’s prose. Technological metaphors, on the other hand, are active (and often imposing) in the sense that they are realized in digital artifacts that are actively doing things, forcefully changing a user’s meaning horizon. Technological creators cannot generally afford to require their potential audience to wonder how the metaphor works; normally the selling point is that the usefulness of the technology is obvious at first glance. Shakespeare, on the other hand, is beloved in part because the meaning of his works is not immediately obvious and requires some thought on the part of the audience.`,
ko:`디지털 기술은 근본적으로 은유와 관련되어 있지만, 디지털 은유는 중요한 면에서 언어적 은유와 다르다. 언어적 은유는 독자가 은유에 의해 제시된 세계에 적극적으로 들어가도록 선택할 필요가 있다는 점에서 수동적이다. ‘시간은 구걸하는 자이다.’라는 셰익스피어의 은유에서 독자는 인지적인 노력 없이는 그리고 셰익스피어의 산문을 더 끌어들이지 않고는 은유를 이해할 것 같지 않다. 반면에 기술적 은유는 사용자의 의미의 지평을 강력하게 바꾸면서 능동적으로 일을 하는 디지털 인공물에서 그것이 실현된다는 점에서 능동적이다(그리고 흔히 강요적이다). 기술적인 창작자는 일반적으로 그들의 잠재적인 독자에게 어떻게 은유가 작용하는지 궁금해하도록 요구할 여유가 없고, 일반적으로 매력은 기술의 유용성이 첫눈에 분명하다는 것이다. 반면에 셰익스피어는 부분적으로는 그의 작품의 의미가 즉각적으로 분명하지 않고 독자 측에서 어느 정도의 생각을 요구하기 때문에 사랑받는다.`},
{u:11,n:5,k:'정착지와 농업의 발전',t:'From Hunting and Gathering to Civilization',x:['Why Early Farmers Were Healthier than Hunters','The Spread of Epidemic Diseases in Modern Cities'],w:[['abundant','scarce'],['few','many'],['permanent','temporary'],['hard','easy'],['increase','decrease']],
en:`The hunter-gatherer lifestyle, which can be described as “natural” to human beings, appears to have had much to recommend it. Examination of human remains from early hunter-gatherer societies has suggested that our ancestors enjoyed abundant food, obtainable without excessive effort, and suffered very few diseases. If this is true, it is not clear why so many humans settled in permanent villages and developed agriculture, growing crops and domesticating animals: cultivating fields was hard work, and it was in farming villages that epidemic diseases first took root. Whatever its immediate effect on the lives of humans, the development of settlements and agriculture undoubtedly led to a high increase in population density. This period, known as the New Stone Age, was a major turning point in human development, opening the way to the growth of the first towns and cities, and eventually leading to settled “civilizations.”`,
ko:`수렵 채집 생활 방식은 인류에게 ‘자연스러운’ 것으로 묘사될 수 있으며, 그것을 추천할 만한 많은 것이 있는 것으로 보인다. 초기 수렵 채집 사회의 유적 조사에 따르면 우리의 조상들이 과도한 노력 없이도 구할 수 있는 풍족한 식량을 누렸고, 질병에 걸리는 일도 거의 없었다. 이것이 사실이라면, 왜 그렇게 많은 인류가 영구적인 마을에 정착하여 농작물을 재배하고 동물을 길들이면서 농업을 발달시켰는지는 분명하지 않은데, 밭을 경작하는 것은 힘든 일이었고, 전염병이 처음 뿌리를 내린 것은 농경 마을이었다. 인간의 삶에 미치는 그것의 즉각적인 영향이 무엇이든, 정착지와 농업의 발전은 의심의 여지 없이 인구 밀도의 높은 증가로 이어졌다. 신석기 시대로 알려진 이 시기는 인류 발전의 주요한 전환점이었으며, 최초의 마을과 도시가 성장하는 길을 열었고, 결국 정착된 ‘문명’으로 이어졌다.`},
{u:11,n:7,k:'장기 기증자의 뇌사 진단',t:'Do Stricter Brain Death Rules Really Ease Public Fears?',x:['The Growing Need for Organ Donors in Europe','Why Brain Death Diagnosis Cannot Be Trusted'],w:[['tougher','looser'],['ease','increase'],['premature','delayed'],['mistaken','accurate'],['same','different']],
en:`Some countries have proposed tougher guidelines for determining brain death when transplantation — transferring organs to others — is under consideration. In several European countries, there are legal requirements which specify that a whole team of doctors must agree over the diagnosis of death in the case of a potential donor. The reason for these strict regulations for diagnosing brain death in potential organ donors is, no doubt, to ease public fears of a premature diagnosis of brain death for the purpose of obtaining organs. But it is questionable whether these requirements reduce public suspicions as much as they create them. They certainly maintain mistaken beliefs that diagnosing brain death is an unreliable process lacking precision. As a matter of consistency, at least, criteria for diagnosing the deaths of organ donors should be exactly the same as for those for whom immediate burial or cremation is intended.`,
ko:`일부 국가는 장기 이식, 즉 다른 사람에게 장기를 전달하는 것을 고려 중일 때 뇌사를 결정하는 것에 대한 더 엄격한 지침을 제안해 왔다. 몇몇 유럽 국가에는 잠재적 기증자의 경우 의사 팀 전체가 사망 진단에 동의해야 한다고 명시하는 법적 요건들이 있다. 잠재적인 장기 기증자의 뇌사 진단에 대한 이러한 엄격한 규정들의 이유는 의심할 바 없이 장기를 확보하기 위한 너무 이른 뇌사 진단에 대한 대중의 두려움을 완화하기 위한 것이다. 하지만 이러한 요건들이 대중의 의심을 만들어 내는 만큼 그것을 줄여 주는지는 의문이다. 그것들은 뇌사 진단이 정확성이 결여된 신뢰하기 어려운 과정이라는 잘못된 믿음을 확실히 유지시킨다. 적어도 일관성의 이유로 장기 기증자의 사망 진단 기준은 즉각적인 매장 또는 화장이 예정된 사람들에 대한 그것과 정확히 동일해야 한다.`},
{u:11,n:9,k:'칭찬이 아이의 자아상에 미치는 영향',t:'How Praise Shapes a Child’s Self-Image',x:['Teaching Preschoolers to Reject False Information','Too Much Praise Spoils Children'],w:[['powerful','useless'],['incorporate','reject'],['longer','shorter'],['confidence','anxiety'],['volunteer','refuse']],
en:`Although praise is one of the most powerful tools available for improving young children’s behavior, it is equally powerful for improving your child’s self-esteem. Preschoolers believe what their parents tell them in a very profound way. They do not yet have the cognitive sophistication to reason analytically and reject false information. If a preschool boy consistently hears from his mother that he is smart and a good helper, he is likely to incorporate that information into his self-image. Thinking of himself as a boy who is smart and knows how to do things is likely to make him endure longer in problem-solving efforts and increase his confidence in trying new and difficult tasks. Similarly, thinking of himself as the kind of boy who is a good helper will make him more likely to volunteer to help with tasks at home and at preschool.`,
ko:`칭찬이 어린아이들의 행동을 개선하는 데 사용할 수 있는 가장 강력한 도구 중 하나지만, 그것은 자녀의 자존감을 향상하는 데에도 똑같이 강력하다. 미취학 아동들은 그들의 부모가 그들에게 하는 말을 매우 뜻 깊은 방식으로 여긴다. 그들은 분석적으로 추론하고 잘못된 정보를 거부할 수 있는 인지적 정교함을 아직 가지고 있지 않다. 만약 미취학 소년이 그의 어머니로부터 그가 똑똑하고 좋은 조력자라는 것을 계속 듣는다면, 그는 그 정보를 자신의 자아상으로 통합시킬 가능성이 높다. 스스로를 똑똑하고 일을 어떻게 하는지 아는 소년으로 생각하는 것은 그가 문제 해결 노력에 있어 더 오래 지속하도록 하고 새롭고 어려운 일을 시도하는 것에 있어 자신의 자신감을 증가시킬 가능성이 높다. 마찬가지로, 자신을 좋은 조력자인 그런 부류의 소년으로 생각하는 것은 그가 집에서와 유치원에서 일을 자발적으로 돕게 할 가능성을 더 크게 만들 것이다.`},
{u:11,n:11,k:'인공 지능의 핵심 특징',t:'Machines That Learn: The Key Feature of AI',x:['Why AI Will Replace Our Friends and Family','A Short History of Computer Programming'],w:[['mind-blowing','disappointing'],['learn','forget'],['self-improve','break down'],['more','less'],['important','unnecessary']],
en:`You may have seen headlines in the news about some of the things machines powered by artificial intelligence can do. However, if you were to consider all the tasks that AI-powered machines could actually perform, it would be quite mind-blowing! One of the key features of artificial intelligence is that it enables machines to learn new things, rather than requiring programming specific to new tasks. Therefore, the core difference between computers of the future and those of the past is that future computers will be able to learn and self-improve. In the near future, smart virtual assistants will know more about you than your closest friends and family members do. Can you imagine how that might change our lives? These kinds of changes are exactly why it is so important to recognize the implications that new technologies will have for our world.`,
ko:`여러분은 인공 지능으로 구동되는 기계가 할 수 있는 몇 가지 일에 대한 뉴스 헤드라인들을 본 적이 있을 것이다. 하지만, AI로 구동되는 기계가 실제로 수행할 수 있는 모든 작업을 고려한다면, 그것은 꽤 놀라울 것이다! 인공 지능의 핵심 특징들 중 하나는 그것이 새로운 작업에 특화된 프로그래밍을 필요로 하기보다는 기계들이 새로운 것을 학습할 수 있게 한다는 것이다. 그러므로, 미래의 컴퓨터들과 과거의 그것들 사이의 핵심적인 차이점은 미래의 컴퓨터가 학습하고 스스로 개선할 수 있을 것이라는 점이다. 가까운 미래에, 스마트 가상 비서는 여러분에 대해 여러분의 가장 가까운 친구나 가족이 아는 것보다 더 많이 알게 될 것이다. 그것이 우리의 삶을 어떻게 변화시킬지 상상할 수 있는가? 이러한 종류의 변화는 정확히 새로운 기술들이 우리 세계에 미칠 영향을 인식하는 것이 아주 중요한 이유이다.`},

{u:4,n:1,k:'인체를 구성하는 원자의 순환',t:'Borrowed Atoms: We Share and Recycle Our Bodies',x:['How Our Lungs Filter Harmful Atoms','Atoms That Belong Only to You'],w:[['some','all'],['borrow','create'],['share','divide'],['older','younger'],['caretaker','owner']],
en:`Many atoms in your body are nearly as old as the universe itself. When you breathe, for example, only some of the atoms that you inhale are exhaled in your next breath. The remaining atoms are taken into your body to become part of you, and they later leave your body by various means. You don’t “own” the atoms that make up your body; you borrow them. We all share from the same atom pool because atoms forever travel around, within, and among us. Atoms cycle from person to person as we breathe and as our sweat is evaporated. We recycle atoms on a grand scale. The origin of the lightest atoms goes back to the origin of the universe, and most heavier atoms are older than the Sun and Earth. There are atoms in your body that have existed since the first moments of time, recycling throughout the universe among limitless forms, both nonliving and living. You’re the present caretaker of the atoms in your body. There will be many who will follow you.`,
ko:`당신의 몸에 있는 많은 원자는 거의 우주 자체만큼이나 오래되었다. 예를 들어, 당신이 숨을 쉴 때 들이마신 원자 중 일부만이 다음 숨에서 내뱉어진다. 남아 있는 원자는 당신의 몸으로 들어가 당신의 일부가 되고, 이후 그것들은 다양한 방법으로 당신의 몸을 떠난다. 당신은 당신의 몸을 구성하는 원자를 ‘소유하지’ 않는데, 즉 당신은 그것들을 빌린다. 원자는 영원히 우리 주변과 내부, 그리고 우리 사이를 이동하기 때문에 우리 모두는 같은 원자 풀로부터 공유한다. 원자는 우리가 숨을 쉬고 땀이 증발되면서 사람에서 사람으로 순환한다. 우리는 거대한 규모로 원자를 재순환시킨다. 가장 가벼운 원자의 기원은 우주의 기원으로 거슬러 올라가며, 대부분의 더 무거운 원자는 태양과 지구보다 더 오래되었다. 태초부터 존재해 온 원자가 당신의 몸에 있으며 제한 없는 형태, 즉 비생물체와 생물체 가운데 우주 전체에 걸쳐 재순환한다. 당신은 몸속 원자의 현재 관리인이다. 당신의 뒤를 이을 많은 것[사람]들이 있을 것이다.`},
{u:4,n:3,k:'기억의 재구성과 인식의 오류',t:'Memory Is Reconstructed, Not Replayed',x:['How to Remember Everything Like a Camera','Why Eyewitness Testimony Is Always Reliable'],w:[['reconstruct','retrieve'],['efficient','wasteful'],['struggle','succeed'],['cost','benefit'],['undermined','strengthened']],
en:`When we see something, we naturally and automatically break it up into shapes, colors, and concepts that we have learned through education. We recode what we see through the lens of everything we know. We reconstruct memories rather than retrieving the video from memory. This is a useful trait. It’s a more efficient way to store information — a bit like an optimal image compression algorithm such as JPG, rather than storing a raw bitmap image file. People who lack this ability and remember everything in perfect detail struggle to generalize, learn, and make connections between what they have learned. But representing the world as abstract ideas and features comes at a cost of seeing the world as it is. Instead, we see the world through our assumptions, motivations, and past experiences. The discovery that our memories are reconstructed through abstract representations rather than played back like a movie completely undermined the legal primacy of eyewitness testimony. Seeing is not believing.`,
ko:`우리가 무언가를 볼 때, 우리는 자연스럽게 그리고 자동적으로 그것을 우리가 교육을 통해 배운 형태, 색상, 그리고 개념들로 해체한다. 우리는 우리가 알고 있는 모든 것의 렌즈를 통해 우리가 보는 것을 재부호화한다. 우리는 기억에서 영상을 상기하기보다 기억을 재구성한다. 이것은 유용한 특성이다. 그것은 정보를 저장하는 더 효율적인 방법인데, 가공되지 않은 비트맵 이미지 파일을 저장하는 것보다 JPG와 같은 최적의 이미지 압축 알고리즘과 약간 비슷한 것이다. 이런 능력이 부족하고 완벽히 세세하게 모든 것을 기억하는 사람들은 일반화하고, 학습하고, 자신들이 학습한 것들 사이를 연결하려고 고군분투한다. 그러나 세상을 추상적 생각과 특징으로 재현하는 것은 세상을 있는 그대로 보는 대가를 치른다. 대신에, 우리는 우리의 가정, 동기 그리고 과거 경험을 통해 세상을 바라본다. 우리의 기억이 영화처럼 재생되는 것이 아니라 추상적 재현을 통해 재구성된다는 발견은 목격자 증언의 법적 우위성을 완전히 손상시켰다. 보는 것이 믿는 것은 아니다.`},
{u:4,n:5,k:'명확하게 범주화할 수 없는 감각',t:'Senses Don’t Fit into Five Boxes',x:['Aristotle’s Five Senses Still Hold True','How Snakes Hunt Their Prey in the Dark'],w:[['doubt','accept'],['different','similar'],['missed','added'],['harder','easier'],['limited','unlimited']],
en:`Consider the seemingly simple question How many senses are there? Around 2,370 years ago, Aristotle wrote that there are five, in both humans and animals — sight, hearing, smell, taste, and touch. However, according to the philosopher Fiona Macpherson, there are reasons to doubt it. For a start, Aristotle missed a few in humans: the perception of your own body which is different from touch and the sense of balance which has links to both touch and vision. Other animals have senses that are even harder to categorize. Many vertebrates have a different sense system for detecting odors. Some snakes can detect the body heat of their prey. These examples tell us that “senses cannot be clearly divided into a limited number of specific kinds,” Macpherson wrote in The Senses. Instead of trying to push animal senses into Aristotelian buckets, we should study them for what they are.`,
ko:`‘얼마나 많은 감각이 존재하는가?’라는 겉으로 보기에 단순한 질문을 고려해 보라. 약 2,370년 전 Aristotle은 인간과 동물 둘 다에게 시각, 청각, 후각, 미각, 그리고 촉각의 다섯(감각)이 있다고 썼다. 그러나 철학자 Fiona Macpherson에 따르면, 그것을 의심할 이유가 존재한다. 우선, Aristotle은 인간에게서 몇 가지를 빠뜨렸는데, 그것은 촉각과는 다른 여러분 자신의 신체에 대한 인식과, 촉각과 시각 모두에 관련되어 있는 균형 감각이었다. 다른 동물들은 훨씬 더 범주화하기 어려운 감각을 가지고 있다. 많은 척추동물은 냄새를 탐지하기 위한 다른 감각 체계를 가지고 있다. 어떤 뱀은 그들의 먹잇감의 체열을 감지할 수 있다. Macpherson이 The Senses에서 쓰기를, 이러한 사례는 우리에게 “감각은 제한된 수의 특정한 종류로 명확하게 나누어지지 않을 수 있다”는 것을 알려 준다. 동물의 감각을 Aristotle의 양동이로 밀어 넣으려고 노력하는 대신, 우리는 그것들을 존재하는 그대로 연구해야 한다.`},
{u:4,n:7,k:'이해되지 못하는 과학 논문',t:'A Paper Unread Is a Sound Unheard',x:['Why Scientists Should Publish More Papers','The Physics of Sound Waves in Forests'],w:[['hearer','speaker'],['two-way','one-way'],['useless','valuable'],['complete','started'],['understood','criticized']],
en:`Most people have no doubt heard this question: If a tree falls in the forest and there is no one there to hear it fall, does it make a sound? The correct answer is no. Sound is more than pressure waves, and indeed there can be no sound without a hearer. And similarly, scientific communication is a two-way process. Just as a signal of any kind is useless unless it is perceived, a published scientific paper (signal) is useless unless it is both received and understood by its intended audience. Thus we can restate the axiom of science as follows: A scientific experiment is not complete until the results have been published and understood. Publication is no more than pressure waves unless the published paper is understood. Too many scientific papers fall silently in the woods.`,
ko:`대부분의 사람들은 틀림없이 이 질문을 들어 봤을 것이다. 만약 숲에서 나무가 쓰러지고 그것이 쓰러지는 소리를 들을 사람이 거기에 아무도 없다면, 그것은 소리가 나는 것일까? 정답은 ‘아니요’이다. 소리는 압력파 이상이며, 정말로 듣는 사람 없이는 소리가 있을 수 없다. 마찬가지로, 과학적 커뮤니케이션은 양방향 프로세스이다. 어떠한 종류의 신호든 그것이 감지되지 않으면 쓸모가 없는 것처럼, 출판된 과학 논문(신호)은 그것이 의도된 독자에 의해 수신되고 ‘그리고’ 이해되지 않으면 쓸모가 없다. 따라서 우리는 과학의 자명한 이치를 다음과 같이 재진술할 수 있다. 과학 실험은 결과가 출판되고 ‘그리고 이해될’ 때까지 완성되지 않는다. 출판된 논문이 이해되지 않으면 출판은 압력파에 지나지 않는다. 너무 많은 과학 논문이 소리 없이 숲속에서 쓰러진다.`},
{u:4,n:9,k:'신기술에 따르는 비용',t:'The Hidden Costs of Technology on Work',x:['Technology Creates Only Safe and Healthy Jobs','The Joy of Traditional Handcrafts'],w:[['costs','benefits'],['hate','love'],['dangerous','safe'],['avoid','seek'],['risk','benefit']],
en:`If we adopt technology, we need to pay its costs. Thousands of traditional livelihoods have been pushed aside by progress, and the lifestyles around those jobs removed. Hundreds of millions of humans today work at jobs they hate, producing things they have no love for. Sometimes these jobs cause physical pain, disability, or chronic disease. Technology creates many new jobs that are certainly dangerous. At the same time, mass education and media train humans to avoid low-tech physical work, to seek jobs working in the digital world. The divorce of the hands from the head puts a stress on the human mind. Indeed, the sedentary nature of the best-paying jobs is a health risk — for body and mind.`,
ko:`만약 우리가 기술을 받아들이면, 우리는 그것의 비용을 치러야 한다. 수천 개의 전통적인 생계 수단이 발전에 의해 밀려났으며, 그 직업들과 관련된 생활 방식이 없어졌다. 오늘날 수억 명의 사람들이 자기가 싫어하는 일자리에서 일하면서, 자신이 아무런 애정을 느끼지 못하는 것들을 생산한다. 때때로 이러한 일자리는 육체적 고통, 장애 또는 만성 질환을 유발한다. 기술은 확실히 위험한 많은 새로운 일자리를 창출한다. 동시에, 대중 교육과 대중 매체는 낮은 기술의 육체노동을 피하고 디지털 세계에서 일하는 직업을 찾도록 인간을 훈련시킨다. 머리로부터 손이 단절되는 것은 인간의 정신에 부담을 준다. 실제로, 가장 보수가 좋은 직업의 주로 앉아서 하는 특성은 신체와 정신에 건강 위험 요소이다.`},
{u:4,n:11,k:'고객의 무리한 요구 거절하기',t:'The Customer Is Not Always Right',x:['How to Keep Every Customer Satisfied','Why Companies Should Never Offer Replacements'],w:[['replacement','refund'],['undamaged','broken'],['fire','satisfy'],['dissatisfied','pleased'],['rest','worst']],
en:`Is the customer always right? When customers return a broken product to a famous company, which makes kitchen and bathroom fixtures, the company nearly always offers a replacement to maintain good customer relations. Still, “there are times you’ve got to say ‘no,’” explains the warranty expert of the company, such as when a product is undamaged or has been abused. Entrepreneur Lauren Thorp, who owns an e-commerce company, says, “While the customer is ‘always’ right, sometimes you just have to fire a customer.” When Thorp has tried everything to resolve a complaint and realizes that the customer will be dissatisfied no matter what, she returns her attention to the rest of her customers, who she says are “the reason for my success.”`,
ko:`고객은 ‘항상’ 옳은가? 주방과 욕실 설비를 만드는 한 유명한 회사에 고객들이 고장 난 제품을 반품할 때 그 회사는 좋은 고객 관계를 유지하기 위해 거의 항상 대체품을 제공한다. 그럼에도, 그 회사의 상품 보증 전문가는, 상품이 멀쩡하거나 남용되었을 때와 같이, “‘안 돼요.’라고 말을 해야 할 때가 있다.”고 설명한다. 전자 상거래 회사를 소유한 기업가 Lauren Thorp는 “고객이 ‘항상’ 옳지만, 때로는 당신이 고객을 해고해야만 한다.”라고 말한다. Thorp가 불만을 해결하기 위해 최선을 다해 왔는데 그 고객이 어떠한 경우에도 만족하지 않을 것이란 사실을 깨달을 때, 그녀는 자신의 주의를 나머지 다른 고객들에게 돌리는데, 그 고객들은 “내 성공의 이유”라고 그녀는 말한다.`},

{u:12,n:1,k:'자원과 공유의 역설',t:'The More We Have, the Less We Share',x:['The Hospitality Traditions of Nomadic Tribes','Why Better Security Keeps Us Safe'],w:[['complicated','strengthened'],['less','more'],['interest','loss'],['survival','reputation'],['decreased','increased']],
en:`For a species born in a time when resources were limited and dangers were great, our natural tendency to share and cooperate is complicated when resources are plenty and outside dangers are few. When we have less, we tend to be more open to sharing what we have. Certain nomadic tribes don’t have much, yet they are happy to share because it is in their interest to do so. If you happen upon them in your travels, they will open up their homes and give you their food and hospitality. It’s not just because they are nice people; it’s because their survival depends on sharing, for they know that they may be the travelers in need of food and shelter another day. Ironically, the more we have, the bigger our fences, the more sophisticated our security to keep people away and the less we want to share. Our desire for more, combined with our decreased physical interaction with the “common folk,” starts to create a disconnection or blindness to reality.`,
ko:`자원이 제한적이고 위험이 컸던 시기에 태어난 종에게 있어, 자원이 풍부하고 외부의 위험이 거의 없을 때 나누고 협력하려는 우리의 타고난 성향은 복잡해진다. 우리가 더 적게 가질 때, 우리는 가진 것을 나누는 데 더 개방적이 되는 경향이 있다. 특정 유목 부족은 많은 것을 가지고 있지 않지만, 그렇게 하는 것이 그들의 이익에 부합하기 때문에 그들은 기꺼이 나누려고 한다. 만약 여러분이 여행 중 그들을 우연히 만나면, 그들은 자신의 집을 열고 여러분에게 음식과 환대를 제공할 것이다. 이는 그들이 좋은 사람이어서만이 아니고, 이는 그들의 생존이 나누는 것에 달려 있기 때문인데, 왜냐하면 그들은 또 다른 날 그들이 음식과 거처가 필요한 여행자가 될 수도 있음을 알기 때문이다. 아이러니하게도, 우리가 더 많이 가질수록, 우리의 울타리는 더 커지고, 사람들을 멀리 두기 위해 우리의 보안은 더 정교해지며, 우리는 더 적게 나누기를 원하게 된다. 우리의 더 많은 것에 대한 욕망은 ‘일반 대중’과의 줄어든 물리적인 상호 작용과 결합되어, 현실에 대한 단절이나 무분별을 만들어 내기 시작한다.`},
{u:12,n:3,k:'인지적 한계와 집합적 두뇌',t:'Collective Brains: Sharing the Work of Thinking',x:['Why Everyone Should Understand How Technology Works','Herbert Simon and the Limits of Economics'],w:[['distribute','concentrate'],['transmitted','hidden'],['more','less'],['benefit','suffer'],['collective','individual']],
en:`Herbert Simon won his Nobel Prize for recognizing our limitations in information, time, and cognitive capacity. As we lack the resources to compute answers independently, we distribute the computation across the population and solve the answer slowly, generation by generation. Then all we have to do is socially learn the right answers. You don’t need to understand how your computer or toilet works; you just need to be able to use the interface and flush. All that needs to be transmitted is which button to push — essentially how to interact with technologies rather than how they work. And so instead of holding more information than we have mental capacity for and indeed need to know, we could dedicate our large brains to a small piece of a giant calculation. We understand things well enough to benefit from them, but all the while we are making small calculations that contribute to a larger whole. We are just doing our part in a larger computation for our societies’ collective brains.`,
ko:`Herbert Simon은 정보, 시간, 그리고 인지적인 능력에서 우리의 한계를 인지한 공로로 노벨상을 받았다. 우리는 독립적으로 해답을 계산하기 위한 자원이 부족하기 때문에 전체 인구에 걸쳐 계산을 분배하고 세대에 걸쳐 해답을 천천히 풀어낸다. 그러면 우리가 해야 할 것은 올바른 해답을 사회적으로 배우는 것이다. 여러분은 여러분의 컴퓨터 혹은 변기가 어떻게 작동하는지 이해할 필요가 없고, 단지 인터페이스를 사용할 수 있고 변기의 물을 내릴 수 있기만 하면 된다. 전달될 필요가 있는 모든 것은 어떤 버튼을 눌러야 하는지, 즉 근본적으로 어떻게 그것들이 작동하는지가 아니라 기술과 상호 작용을 하는 방법이다. 그래서 우리가 정신적 수용을 할 수 있는 것보다, 그리고 정말로 알아야 할 필요가 있는 것보다 더 많은 정보를 가지는 것 대신에 우리는 우리의 큰 두뇌를 거대한 계산의 작은 조각에 바칠 수 있다. 우리는 그것들로부터 이득을 얻기에 충분할 정도로 사물을 잘 이해하지만 그러면서 우리는 더 큰 전체에 기여하는 작은 계산을 하고 있다. 우리는 우리 사회의 집합적인 두뇌를 위한 더 큰 계산에서 단지 우리의 역할을 하고 있는 것이다.`},
{u:12,n:5,k:'미니멀리즘',t:'Minimalism Doesn’t Hurt Your Emotions',x:['Give Up Every Modern Convenience','Why We Should Keep Our Old Possessions'],w:[['negative','positive'],['attachment','indifference'],['hurt','heal'],['wrong','right'],['overcome','maintained'],['eliminate','collect']],
en:`The term minimalism gives a negative impression to some people who think that it is all about sacrificing valuable possessions. This insecurity naturally stems from their attachment to their possessions. It is difficult to distance oneself from something that has been around for quite some time. Being an emotional animal, human beings give meaning to the things around them. So, the question arising here is that if minimalism will hurt one’s emotions, why become a minimalist? The answer is very simple; the assumption of the question is fundamentally wrong. Minimalism does not hurt emotions. You might feel a bit sad while getting rid of a useless item but sooner than later, this feeling will be overcome by the joy of clarity. Minimalists never argue that you should leave every convenience of the modern era. They are of the view that you only need to eliminate stuff that is unused or not going to be used in the near future.`,
ko:`미니멀리즘이라는 용어는 소중한 소유물을 희생하는 것이 전부라고 생각하는 일부 사람들에게 부정적인 인상을 준다. 이러한 불안은 자신의 소유물에 대한 애착에서 자연스럽게 비롯된다. 꽤 오랫동안 곁에 있어 왔던 것으로부터 자신을 멀리 두는 것은 어렵다. 감정의 동물이기 때문에, 인간은 그들의 곁에 있는 물건에 의미를 부여한다. 그래서 여기서 생기는 질문은 미니멀리즘이 사람의 감정을 상하게 한다면 왜 미니멀리스트가 되느냐는 것이다. 대답은 매우 간단한데, 그 질문의 가정은 근본적으로 잘못되었다. 미니멀리즘은 감정을 상하게 하지 않는다. 여러분은 쓸모없는 물건을 치우면서 조금 슬프게 느낄 수도 있지만 머지않아 이 느낌은 명료함의 기쁨으로 극복될 것이다. 미니멀리스트는 여러분이 현대의 모든 편의를 버려야 한다고 주장하지 않는다. 그들은 여러분이 사용되지 않거나 가까운 미래에 사용되지 않을 물건을 없애기만 하면 된다는 견해를 가지고 있다.`},
{u:12,n:7,k:'판매 촉진을 위한 광고 전략',t:'Selling Yeast in a New Way',x:['The Rise of Homemade Bread in the 20th Century','Yeast Will Always Be the Soul of Bread'],w:[['adapting','ignoring'],['decreased','increased'],['boost','reduce'],['benefits','risks'],['Repositioning','Abandoning']],
en:`Advertisers often displayed considerable facility in adapting their claims to the market status of the goods they promoted. Fleischmann’s yeast, for instance, was used as an ingredient for cooking homemade bread. Yet more and more people in the early 20th century were buying their bread from stores or bakeries, so consumer demand for yeast decreased. The producer of Fleischmann’s yeast hired the J. Walter Thompson advertising agency to come up with a different marketing strategy to boost sales. No longer the “Soul of Bread,” the Thompson agency first turned yeast into an important source of vitamins with significant health benefits. Shortly thereafter, the advertising agency transformed yeast into a natural laxative. Repositioning yeast helped increase sales.`,
ko:`광고주들은 그들이 홍보하는 상품의 시장 지위에 맞게 그들의 주장을 조절하는 데 상당한 재능을 자주 보여 주었다. 예를 들어, Fleischmann의 효모는 집에서 만든 빵을 요리하는 데에 재료로 사용되었다. 하지만 20세기 초에 점점 더 많은 사람들이 가게나 빵집에서 빵을 사고 있었고, 그래서 효모에 대한 소비자 수요는 감소했다. Fleischmann의 효모 생산자는 판매를 촉진하기 위해서 다른 마케팅 전략을 고안하려고 J. Walter Thompson 광고 대행사를 고용했다. Thompson 광고 대행사는 먼저 효모를 더 이상 ‘Soul of Bread’가 아니라 상당한 건강상의 이점이 있는 비타민의 중요한 공급원으로 바꾸었다. 그 직후, 광고 대행사는 효모를 천연 완하제로 바꾸었다. 효모의 이미지 전환을 꾀하는 것은 매출을 증가시키는 것을 도왔다.`},
{u:12,n:9,k:'옥신이 식물의 성장에 미치는 영향',t:'How Auxins Make Plants Bend',x:['Why Plants Need Sunlight to Survive','Roots That Always Grow Toward the Light'],w:[['stimulate','limit'],['faster','slower'],['towards','away from'],['opposite','same'],['slower','faster'],['downwards','upwards']],
en:`Plant growth is controlled by a group of hormones called auxins found at the tips of stems and roots of plants. Auxins produced at the tips of stems tend to accumulate on the side of the stem that is in the shade. Accordingly, the auxins stimulate growth on the shaded side of the plant. Therefore, the shaded side grows faster than the side facing the sunlight. This phenomenon causes the stem to bend and appear to be growing towards the light. Auxins have the opposite effect on the roots of plants. Auxins in the tips of roots tend to limit growth. If a root is horizontal in the soil, the auxins will accumulate on the lower side and interfere with its development. Therefore, the lower side of the root will grow slower than the upper side. This will, in turn, cause the root to bend downwards, with the tip of the root growing in that direction.`,
ko:`식물의 성장은 식물의 줄기와 뿌리의 끝에서 발견되는 옥신이라고 불리는 호르몬 그룹에 의해 조절된다. 줄기의 끝에서 생산된 옥신은 그늘진 곳에 있는 줄기의 옆면에 축적되는 경향이 있다. 따라서, 옥신은 식물의 그늘진 면에서의 성장을 자극한다. 그리하여 그늘진 면은 햇빛을 마주하는 면보다 더 빨리 자란다. 이 현상은 줄기가 휘어지게 하고 빛을 향하여 성장하고 있는 것처럼 보이게 한다. 옥신은 식물의 뿌리에서는 반대의 효과를 가진다. 뿌리 끝에 있는 옥신은 성장을 제한하는 경향이 있다. 만약 하나의 뿌리가 토양 속에서 수평이라면, 옥신은 아래쪽에 축적되어 그것의 발달을 방해할 것이다. 그러므로 뿌리의 아래쪽은 위쪽보다 더 느리게 자랄 것이다. 이것은 뿌리의 끝부분이 그 방향으로 자라면서 결과적으로 뿌리가 아래로 휘어지게 할 것이다.`},
{u:12,n:11,k:'자신을 있는 그대로 받아들이기',t:'Take Back Control of Your Own Life',x:['Meeting Others’ Expectations Brings Happiness','The Grass Is Always Greener on Our Side'],w:[['influence','respect'],['expectations','advice'],['envying','ignoring'],['recover','give up'],['kindly','strictly']],
en:`Do you sometimes feel like you don’t love your life? Like, deep inside, something is missing? That’s because we are living someone else’s life. We allow other people to influence our choices. We are trying to meet their expectations. Social pressure is deceiving — we are all impacted without noticing it. Before we realize we are losing ownership of our lives, we end up envying how other people live. Then, we can only see the greener grass — ours is never good enough. To regain that passion for the life you want, you must recover control of your choices. No one but yourself can choose how you live. But, how? The first step to getting rid of expectations is to treat yourself kindly. You can’t truly love other people if you don’t love yourself first. When we accept who we are, there’s no room for other’s expectations.`,
ko:`당신은 가끔 당신의 삶을 사랑하지 않는다고 느끼는가? 마치, 마음 깊은 곳에서 뭔가가 빠진 것처럼? 그것은 우리가 타인의 삶을 살고 있기 때문이다. 우리는 다른 사람들이 우리의 선택에 영향을 주도록 허용한다. 우리는 그들의 기대감을 만족시키기 위해 노력하고 있다. 사회적 압력은 (우리를) 현혹시키는데, 우리 모두는 그것을 눈치채지도 못한 채 영향을 받는다. 우리의 삶에 대한 소유권을 잃었다는 것을 깨닫기도 전에, 우리는 결국 다른 사람들이 어떻게 사는지를 부러워하게 된다. 그러면, 우리는 더 푸른 잔디(타인의 삶이 더 좋아 보이는 것)만 볼 수 있게 되며, 우리의 삶은 충분히 좋아질 수 없다. 당신이 원하는 삶에 대한 열정을 되찾기 위해서는 당신의 선택에 대한 통제력을 회복해야 한다. 당신 자신을 제외한 그 누구도 당신이 어떻게 살지를 선택할 수 없다. 하지만 어떻게 해야 할까? 기대감을 버리는 첫 단계는 자신을 친절하게 대하는 것이다. 자신을 먼저 사랑하지 않으면 다른 사람을 진정으로 사랑할 수 없다. 우리가 우리의 있는 그대로를 받아들일 때, 타인의 기대감을 위한 여지는 남아 있지 않다.`},

{u:6,n:1,k:'인간의 감각을 확장하는 과학적 도구',t:'Tools That Extend Human Senses',x:['Why Tools Can Never Replace Our Senses','Differences Between Seeing and Hearing'],w:[['amplifying','reducing'],['far','close'],['observe','ignore'],['visible','invisible'],['outside','within']],
en:`For many centuries, humans have taken advantage of tools that translate and bring into our perception natural phenomena that we can’t perceive with our senses. In some cases, this consists of simply amplifying signals that feed into our normal sensory inputs (e.g., telescopes can bring into clear view that which is too far away for our eyes to perceive on their own). Other instruments turn signals that we cannot perceive into ones that we can observe. Some of these take the form of expanding the reach of our current senses, such as creating visible images based on the ultraviolet spectrum of light or changing sounds that are normally outside the range of what human ears can hear into audible signals. Alternatively, some instruments measure properties for which we have no sensory capacity at all and change them into that which we can observe.`,
ko:`수 세기 동안, 인간은 우리의 감각으로는 지각할 수 없는 자연 현상을 바꾸고 우리의 지각으로 가져오는 도구들을 이용해 왔다. 어떤 경우에, 이것은 우리의 일반적인 감각 입력으로 들어오는 신호를 단순히 확장하는 것(예를 들어, 망원경은 너무 멀어서 우리 눈이 그 자체로 지각할 수 없는 것을 명확한 시야로 가져올 수 있다)으로 구성된다. 다른 도구들은 우리가 인지할 수 없는 신호를 우리가 관찰할 수 있는 것으로 바꾼다. 이러한 도구 중 일부는 자외선 스펙트럼을 기반으로 가시 이미지를 생성하거나 일반적으로 인간의 귀가 들을 수 있는 것의 범위를 벗어나는 소리를 들을 수 있는 신호로 바꾸는 것과 같은 현재 감각의 범위를 확장하는 형태를 취한다. 그렇지 않으면, 일부 도구들은 우리가 전혀 감각 수용 능력이 없는 속성을 측정하고 이를 우리가 관찰할 수 있는 것으로 그것들을 바꾼다.`},
{u:6,n:3,k:'정량적 데이터를 위한 구체적 질문',t:'Ask Concrete Questions to Get Reliable Data',x:['Numbers Can Never Measure Human Emotions','Bigger Samples Always Mean Better Research'],w:[['inaccurate','precise'],['vary','agree'],['concrete','vague'],['clearer','vaguer'],['consistency','variety']],
en:`Many forms of research lead naturally to quantitative data. A study of happiness might measure the number of times someone smiles during an interaction, and a study of memory might measure the number of items an individual can recall after one, five, and ten minutes. Asking people how many times in a year they are sad will also yield quantitative data, but it might not be reliable. Respondents’ recollections may be inaccurate, and their definitions of ‘sad’ could vary widely. But asking “How many times in the past year were you sad enough to call in sick to work?” prompts a concrete answer. Similarly, instead of asking people to rate how bad a procrastinator they are, ask, “How many of your utility bills are you currently late in paying, even though you can afford to pay them?” Questions that seek concrete responses help make abstract concepts clearer and ensure consistency from one study to the next.`,
ko:`많은 종류의 연구는 자연스럽게 정량적 데이터로 이어진다. 행복에 관한 연구는 누군가가 상호 작용 중에 미소 짓는 횟수를 측정할 수 있고, 기억에 관한 연구는 개인이 1분, 5분, 그리고 10분 후에 회상할 수 있는 항목의 수를 측정할 수 있다. 사람들에게 자신이 일 년에 몇 번 슬픈지 물어보는 것 또한 정량적 데이터를 산출할 것이지만, 이는 신뢰할 만하지 않을 수도 있다. 응답자의 회상은 부정확할 수 있고, ‘슬픈’에 대한 그들의 정의는 크게 다를 수 있다. 그러나 “지난 1년 동안 직장에 병가를 낼 만큼 슬펐던 적이 몇 번이었습니까?”라고 묻는 것은 구체적인 답변을 유발한다. 마찬가지로, 사람들에게 그들이 얼마나 심하게 미루는 사람인지를 평가하도록 묻는 대신, “지불할 여유가 있음에도 불구하고 얼마나 많은 공과금 고지서의 납부가 현재 늦었나요?”라고 물어보라. 구체적인 응답을 요구하는 질문은 추상적인 개념을 더 명확하게 만들고 한 연구에서 다음 연구 간의 일관성을 보장하는 데 도움이 된다.`},
{u:6,n:5,k:'구강 건강이 신체에 미치는 영향',t:'Your Mouth: The Gateway to Your Whole Body’s Health',x:['How Unhealthy Eating Habits Damage the Body','Oral Health and Emotional Well-Being'],w:[['prevent','allow'],['adequate','limited'],['tip','base'],['entire','single'],['serious','minor']],
en:`Nearly everything has to go through your mouth to get to the rest of you, from food and air to bacteria and viruses. A healthy mouth can help your body get what it needs and prevent it from harm — with adequate space for air to travel to your lungs, and healthy teeth and gums that prevent harmful microorganisms from entering your bloodstream. From the moment you are created, oral health affects every aspect of your life. What happens in the mouth is usually just the tip of the iceberg and a reflection of what is happening in other parts of the body. Poor oral health can be a cause of a disease that affects the entire body. The microorganisms in an unhealthy mouth can enter the bloodstream and travel anywhere in the body, posing serious health risks.`,
ko:`음식과 공기에서부터 박테리아와 바이러스까지 거의 모든 것이 여러분의 나머지 부분에 도달하기 위해 여러분의 입을 거쳐야 한다. 건강한 입은 공기가 폐로 이동할 수 있는 적당한 공간, 그리고 해로운 미생물이 혈류로 들어가는 것을 막는 건강한 치아와 잇몸으로 여러분의 몸이 필요한 것을 얻고, 피해로부터 몸을 지키도록 도와줄 수 있다. 여러분이 생겨난 순간부터 구강 건강은 여러분의 삶의 모든 측면에 영향을 미친다. 입안에서 일어나는 일은 대개 빙산의 일각일 뿐이며 신체의 다른 부분에서 일어나고 있는 일의 반영이다. 나쁜 구강 건강은 전체 몸에 영향을 끼치는 질병의 원인이 될 수 있다. 건강하지 않은 입안의 미생물은 혈류로 들어가고 신체의 어느 곳이든 이동하여 심각한 건강상의 위험을 초래할 수 있다.`},
{u:6,n:7,k:'자신을 평균 이상이라고 믿는 경향',t:'The Lake Wobegon Effect: We All Think We’re Above Average',x:['Why Every Leader Needs a Positive Self-Image','Why Others Always Seem Better than Us'],w:[['desirable','harmful'],['free','full'],['less','more'],['reliable','rare'],['above','below']],
en:`We tend to believe that we possess a host of socially desirable characteristics, and that we are free of most of those that are socially undesirable. For example, a large majority of the general public thinks that they are more intelligent, more fair-minded, less prejudiced, and more skilled behind the wheel of an automobile than the average person. This phenomenon is so reliable and ubiquitous that it has come to be known as the “Lake Wobegon effect,” after Garrison Keillor’s fictional community where “the women are strong, the men are good-looking, and all the children are above average.” A survey of one million high school seniors found that 70% thought they were above average in leadership ability, and only 2% thought they were below average. In terms of ability to get along with others, all students thought they were above average, 60% thought they were in the top 10%, and 25% thought they were in the top 1%!`,
ko:`우리는 우리가 사회적으로 바람직한 특성들을 많이 지니고 있고, 우리는 사회적으로 바람직하지 않은 특성들의 대부분은 지니고 있지 않다고 믿는 경향이 있다. 예를 들어, 대다수의 일반 대중들은 그들이 보통 사람보다 더 지적이고, 더 공정하며, 덜 편견을 가지고, 자동차를 운전할 때 더 능숙하다고 생각한다. 이 현상은 매우 신뢰할 만하고 도처에 있어서 ‘여성들은 강하고, 남성들은 잘생겼으며, 모든 아이들은 평균 이상’인 Garrison Keillor의 허구의 공동체 이름을 따서 ‘워비곤 호수 효과(Lake Wobegon effect)’라고 알려지게 되었다. 고등학교 최고 학년 학생 100만 명을 대상으로 한 설문 조사에서 70퍼센트는 자신이 리더십 능력에 있어 평균 이상이라고 생각했고, 2퍼센트만이 자신이 평균 이하라고 생각했다는 것을 발견했다. 다른 사람들과 잘 지내는 능력 면에서, ‘모든’ 학생들은 자신이 평균 이상이라고 생각했고, 60퍼센트는 자신이 상위 10퍼센트에 속한다고 생각했으며, 25퍼센트는 자신이 상위 1퍼센트에 속한다고 생각했다!`},
{u:6,n:9,k:'인간 진화와 소속감',t:'Why Evolution Favored the Need to Belong',x:['How to Avoid Competition Among Social Groups','How Children Learn Through Relationships'],w:[['belong','compete'],['useful','harmful'],['prevail','lose'],['favor','discourage'],['promote','hinder']],
en:`For creatures like us, evolution smiled upon those with a strong need to belong. Survival and reproduction are the criteria of success by natural selection, and forming relationships with other people can be useful for both survival and reproduction. Groups can share resources, care for sick members, scare off predators, fight together against enemies, divide tasks so as to improve efficiency, and contribute to survival in many other ways. In particular, if an individual and a group want the same resource, the group will generally prevail, so competition for resources would especially favor a need to belong. Belongingness will likewise promote reproduction, such as by bringing potential mates into contact with each other, and in particular by keeping parents together to care for their children, who are much more likely to survive if they have more than one caregiver.`,
ko:`우리와 같은 창조물에게 있어 진화는 소속하려는 강한 욕구를 가진 것들에 미소를 지었다. 생존과 번식은 자연 선택에 의한 성공의 기준이고, 다른 사람들과 관계를 형성하는 것은 생존과 번식 둘 다에 유용할 수 있다. 집단은 자원을 공유하고, 아픈 구성원을 돌보고, 포식자를 겁을 주어 쫓아 버리고, 적에 맞서서 함께 싸우고, 효율성을 향상하기 위해 일을 나누고, 많은 다른 방식에서 생존에 기여할 수 있다. 특히, 한 개인과 한 집단이 같은 자원을 원하면, 집단이 일반적으로 이기고, 그래서 자원에 대한 경쟁은 소속하려는 욕구를 특별히 좋아할 것이다. 마찬가지로 소속되어 있다는 것은 번식을 촉진시키는데, 이를테면 잠재적인 짝을 서로 만나게 해 주거나, 특히 부모가 자녀를 돌보기 위해 함께 있도록 함으로써인데, 자녀들은 한 명보다 많은 돌보는 이가 있으면 훨씬 더 생존하기 쉬울 것이다.`},
{u:6,n:11,k:'날씨 예측을 기반으로 하는 인간 사회',t:'How Climate Knowledge Shapes Our Lives',x:['New Technologies for Fighting Climate Change','Why Weather Forecasts Often Fail'],w:[['past','future'],['same','different'],['deeper','shallower'],['local','global'],['opposite','same']],
en:`The whole of human society operates on knowing the future weather. For example, farmers in India know when the monsoon rains will come next year and so they know when to plant the crops. Farmers in Indonesia know there are two monsoon rains each year, so next year they can have two harvests. This is based on their knowledge of the past, as the monsoons have always come at about the same time each year in living memory. But the need to predict goes deeper than this; it influences every part of our lives. Our houses, roads, railways, airports, offices, and so on are all designed for the local climate. For example, in England all the houses have central heating, as the outside temperature is usually below 20˚C, but no air-conditioning, as temperatures rarely go beyond 26˚C, while in Australia the opposite is true: most houses have air-conditioning but rarely central heating.`,
ko:`전체 인간 사회는 미래의 날씨를 아는 것을 기반으로 운영된다. 예를 들어, 인도의 농부들은 내년에 언제 몬순 장마가 올 것인지를 알고 그래서 그들은 언제 작물을 심어야 할지를 안다. 인도네시아의 농부들은 매년 몬순 장마가 두 번 있다는 것을 알고, 그래서 이듬해에 그들은 수확을 두 번 할 수 있다. 이것은 과거에 대한 그들의 지식에 기반을 두고 있는데, 살아 있는 기억 속에서 몬순은 매년 항상 거의 같은 시기에 왔기 때문이다. 그러나 예측할 필요는 이것보다 더욱더 깊어지는데, 그것은 우리 생활의 모든 부분에 영향을 미친다. 우리의 집, 도로, 철도, 공항, 사무실 등은 모두 지역의 기후에 맞추어 설계된다. 예를 들어, 영국에서는 외부의 기온이 대체로 섭씨 20도 미만이기 때문에 모든 집은 중앙난방을 갖추고 있지만, 기온이 섭씨 26도 위로 올라가는 일은 거의 없어서 냉방기는 없는 반면, 호주에서는 그 정반대가 사실이어서, 대부분의 집은 냉방기를 갖추었지만 중앙난방은 거의 없다.`},

{u:13,n:1,k:'적응하여 기준선으로 돌아가기',t:'Back to Baseline: We Adapt to Good and Bad',x:['The Lasting Joy of First Love','Why New Toys Make Children Happy Forever'],w:[['adjust','resist'],['default','maximum'],['pulled','pushed'],['fades','grows'],['adapt','regret']],
en:`Whether we feel happy or sad, content or discontent, is not determined merely by each individual successive moment of life experience — a good thing happens and I’m happy, a bad thing happens and I’m sad. While our experiences affect our mood, we are not blown in a completely new direction by each gust of wind. As humans, we adjust — to new information and events both good and bad — and return to our personal default level of well-being. There will be highs and lows, but over time, like water seeking its own level, we are pulled toward our baseline — back up after bad news and back down after good. The euphoria of first love fades, and so does the despair of a break-up. This tendency is best seen with little kids and their toy joy: When they get what they’ve longed for, they believe they will be happy for the rest of their lives. And for the first few minutes of the rest of their lives, they are. But then the kids — like adults — adapt.`,
ko:`우리가 행복하거나 슬프거나, 만족스럽거나 불만족스러운 것은 좋은 일이 일어나면 행복하고, 나쁜 일이 일어나면 슬픈 것처럼 단지 삶의 경험의 각각의 개별적인 연속적인 순간에 의해 결정되지 않는다. 우리의 경험은 우리의 기분에 영향을 미치지만, 우리는 각 돌풍에 의해 완전히 새로운 방향으로 날아가지 않는다. 인간으로서 우리는 좋을 뿐 아니라 나쁘기도 한 새로운 정보와 사건들에 적응하고 우리의 개인적인 기본 행복 수준으로 돌아간다. 기복은 있을 것이지만, 시간이 지나면서 고유한 수위를 찾는 물처럼 우리는 우리의 기준선으로 끌려가는데, 즉 나쁜 소식 후에는 다시 ‘올라’오고 좋은 소식 후에는 다시 ‘내려’온다. 첫사랑의 행복감은 사라지고, 결별의 절망도 그렇다. 이 경향은 어린 아이들과 그들의 장난감 기쁨에서 가장 잘 보인다. 그들은 간절히 원하던 것을 얻을 때, 그들의 남은 인생 동안 행복할 것이라고 믿는다. 그리고 그들의 남은 인생의 처음 몇 분 동안, 그들은 그렇다. 하지만 그러고 나서 어른들처럼 아이들은 적응한다.`},
{u:13,n:3,k:'신제품의 가격 책정',t:'Don’t Overprice Your New Product',x:['Keep Prices High to Show Quality','Why New Businesses Should Keep Upgrading Products'],w:[['distorts','clarifies'],['overprice','underprice'],['costly','minor'],['sacrifice','protect'],['increase','lower']],
en:`Most entrepreneurs put in tremendous amounts of time and effort in creating and launching new products and services and then make the mistake of overpricing them. They have created something they care deeply about, it’s theirs, and this powerful sense of ownership distorts their perception of value which causes them to overprice their products. While many of them are quick to realize that their initial prices are too high, not all these people are happy or willing to drop their prices to make their products more attractive. And this can be a very costly mistake that may lead to the failure of their new business. When you launch a new product or service, your priority should be to get sufficient market adoption as soon as possible and you should be ready to sacrifice your initial prices and profits to achieve this aim. Once you have strong sales volumes, you can increase your prices to maximize your profits.`,
ko:`대부분의 기업가들은 새로운 제품과 서비스를 만들고 출시하는 데 엄청난 시간과 노력을 들이며, 그런 다음 그것들의 가격을 너무 비싸게 책정하는 실수를 저지른다. 그들은 자신이 매우 소중히 여기는 무언가를 만들었고, 그것은 그들의 것이며, 이 강한 소유감은 가치에 대한 그들의 인식을 왜곡하여 그들의 제품 가격을 너무 높게 책정하게 만든다. 그들 중에 많은 이들은 그들의 초기 가격이 너무 높다는 것을 빠르게 깨닫기는 하지만, 이 모든 사람들이 그들의 제품을 더 매력적으로 만들기 위해 흔쾌히 또는 기꺼이 가격을 낮추는 것은 아니다. 그리고 이것은 그들의 새로운 사업의 실패를 초래할 수 있는 손해가 매우 큰 실수가 될 수 있다. 새로운 제품이나 서비스를 출시할 때, 우선순위는 가능한 한 빨리 충분한 시장 도입을 확보하는 것이어야 하며, 이 목표를 달성하기 위해서는 초기 가격과 수익을 희생할 준비가 되어 있어야 한다. 일단 높은 판매량을 확보하게 되면, 수익을 극대화하기 위해 가격을 인상할 수 있다.`},
{u:13,n:5,k:'위대한 작곡가의 요건인 독창성',t:'Originality Makes a Composer Great',x:['Salieri: The Greatest Composer of His Time','Why Great Music Must Be Easy to Understand'],w:[['unfamiliarity','complexity'],['new','familiar'],['overshadowed','praised'],['bad','good'],['original','popular']],
en:`You hear again and again that some of the greatest composers were misunderstood in their own day. Not everyone could understand the compositions of Beethoven, Brahms, or Stravinsky in their day. The reason for this initial lack of acceptance is unfamiliarity. The musical forms, or ideas expressed within them, were completely new. And yet, this is exactly one of the things that makes them so great. Effective composers have their own ideas. Have you ever seen the classic movie Amadeus? The composer Antonio Salieri is the “host” of this movie; he’s depicted as one of the most famous non-great composers — he lived at the time of Mozart and was completely overshadowed by him. Now, Salieri wasn’t a bad composer; in fact, he was a very good one. But he wasn’t one of the world’s great composers because his work wasn’t original. What he wrote sounded just like what everyone else was composing at the time.`,
ko:`여러분은 몇몇 가장 위대한 작곡가들이 그들의 시대에 진가를 인정받지 못했다고 몇 번이고 듣는다. 그들의 시대에 베토벤, 브람스, 또는 스트라빈스키의 곡들을 모든 사람이 이해할 수 있었던 것은 아니었다. 이러한 초기의 수용 부족의 이유는 낯섦이다. 음악적 형식, 또는 그 안에 표현된 생각은 완전히 새로운 것이었다. 그럼에도 불구하고 이것이 바로 그들을 그토록 위대하게 만드는 것들 중 하나이다. 유능한 작곡가는 그들 자신만의 생각을 갖는다. 여러분은 고전 영화 Amadeus를 본 적이 있는가? 작곡가 Antonio Salieri가 이 영화의 ‘주인공’이고, 그는 가장 유명한 위대하지 않은 작곡가 중 한 명으로 묘사되는데, 그는 모차르트 시대에 살았고 그에 의해 완전히 가려졌다. 이제 보니 Salieri는 형편없는 작곡가가 아니었다. 사실, 그는 매우 훌륭한 작곡가였다. 하지만 그의 작품이 독창적이지 않았기 때문에 그는 세계의 위대한 작곡가들 중 한 명은 아니었다. 그가 쓴 곡은 그 당시 모든 다른 사람들이 작곡했던 것과 마찬가지로 들렸다.`},
{u:13,n:7,k:'주의 집중과 뇌의 재구조화',t:'Attention Reshapes the Brain',x:['Why Violinists Have Faster Hands','Taxi Drivers and Long-Term Mental Tiredness'],w:[['larger','smaller'],['sharp','poor'],['precisely','loosely'],['enlarged','reduced'],['changes','remains']],
en:`There’s a lot of scientific evidence demonstrating that focused attention leads to the reshaping of the brain. In animals rewarded for noticing sound (to hunt or to avoid being hunted for example), we find much larger auditory centers in the brain. In animals rewarded for sharp eyesight, the visual areas are larger. Brain scans of violinists provide more evidence, showing dramatic growth and expansion in regions of the cortex that represent the left hand, which has to finger the strings precisely, often at very high speed. Other studies have shown that the hippocampus, which is vital for spatial memory, is enlarged in taxi drivers. The point is that the physical architecture of the brain changes according to where we direct our attention and what we practice doing.`,
ko:`주의 집중이 뇌의 재구조화로 이어진다는 것을 보여 주는 과학적 증거는 많이 있다. (예를 들어 사냥하거나 사냥감이 되는 것을 피하기 위해) 소리를 알아채는 것에 대한 보상을 받은 동물에서 우리는 뇌의 청각 중추가 훨씬 더 큰 것을 발견한다. 예리한 시력에 대한 보상을 받은 동물은 시각 영역이 더 크다. 바이올린 연주자의 뇌 스캔 결과는 더 많은 증거를 제공해서 흔히 매우 빠른 속도로 현을 정확하게 운지해야 하는 왼손을 나타내는 대뇌 피질 영역의 극적인 성장과 확장을 보여 준다. 다른 연구는 공간 기억에 필수적인 해마가 택시 운전사에게서 확대되는 것을 보여 준다. 요점은 우리가 어디에 주의를 기울이고 무엇을 연습하느냐에 따라 뇌의 물리적 구조가 달라진다는 것이다.`},
{u:13,n:9,k:'스스로 적응하는 시각 체계',t:'A Visual System That Adapts Itself',x:['The Dangers of Wearing Reversing Glasses','How Our Eyes Judge Distances'],w:[['adapting','resisting'],['difficulties','advantages'],['adjusted','failed'],['normally','strangely'],['wrong','right']],
en:`A remarkable characteristic of the visual system is that it has the ability of adapting itself. Psychologist George M. Stratton made this clear in an impressive self-experiment. Stratton wore reversing glasses for several days, which literally turned the world upside down for him. In the beginning, this caused him great difficulties: just putting food in his mouth with a fork was a challenge for him. With time, however, his visual system adjusted to the new stimuli from reality, and he was able to act normally in his environment again, even seeing it upright when he concentrated. As he took off his reversing glasses, he was again confronted with problems: he used the wrong hand when he wanted to reach for something, for example. Fortunately, Stratton could reverse the perception, and he did not have to wear reversing glasses for the rest of his life. For him, everything returned to normal after one day.`,
ko:`시각 체계의 두드러진 특징은 스스로 적응하는 능력이 있다는 것이다. 심리학자 George M. Stratton은 인상적인 자가 실험에서 이것을 분명히 했다. Stratton은 며칠 동안 반전 안경을 착용했는데 그 안경은 말 그대로 그에게 세상을 뒤집어 놓았다. 처음에 이것은 그에게 큰 어려움을 초래했는데, 포크로 음식을 입에 넣는 것조차 그에게는 도전이었다. 그러나 시간이 지나면서 그의 시각 체계는 현실의 새로운 자극에 적응했고, 그가 집중했을 때는 심지어 똑바로 보면서, 다시 자신의 환경에서 정상적으로 행동할 수 있었다. 반전 안경을 벗었을 때 그는 다시 문제에 직면했다. 예를 들어 그가 무언가를 잡기를 원할 때 그는 반대 손을 사용했다. 다행히 Stratton은 지각을 뒤집을 수 있었고 평생 반전 안경을 착용하지 않아도 되었다. 그에게 하루 만에 모든 것이 정상으로 돌아왔다.`},
{u:13,n:11,k:'직업적 탁월함과 신뢰',t:'Excellence Connects',x:['Why Celebrities Know Their Products Best','Honesty Is the Key to Building Trust'],w:[['instant','slow'],['admire','envy'],['nothing','everything'],['talent','knowledge'],['desire','refuse']],
en:`Individuals who perform at a high level in their profession often have instant credibility with others. People admire them, they want to be like them, and they feel connected to them. When they speak, others listen — even if the area of their skill has nothing to do with the advice they give. Think about a world-famous basketball player. He has made more money from endorsements than he ever did playing basketball. Is it because of his knowledge of the products he endorses? No. It’s because of what he can do with a basketball. The same can be said of an Olympic medalist swimmer. People listen to him because of what he can do in the pool. And when an actor tells us we should drive a certain car, we don’t listen because of his expertise on engines. We listen because we admire his talent. Excellence connects. If you possess a high level of ability in an area, others may desire to connect with you because of it.`,
ko:`자신의 직업에서 높은 수준으로 수행하는 사람들은 흔히 다른 사람들에게 즉각적인 신뢰를 얻는다. 사람들은 그들을 존경하고, 그들처럼 되고 싶어 하고, 그들과 연결되어 있다고 느낀다. 그들이 말할 때, 다른 사람들은 비록 그들의 기술 분야가 그들이 주는 조언과 전혀 관련이 없을지라도 경청한다. 세계적으로 유명한 농구 선수에 대해 생각해 보라. 그는 그가 농구를 하면서 그간 벌었던 것보다 광고로부터 더 많은 돈을 벌었다. 그것이 그가 광고하는 제품에 대한 그의 지식 때문일까? 아니다. 그것은 그가 농구로 할 수 있는 것 때문이다. 올림픽 메달리스트 수영 선수도 마찬가지이다. 사람들은 그가 수영장에서 할 수 있는 것 때문에 그의 말을 경청한다. 그리고 어떤 배우가 우리에게 특정 자동차를 운전해야 한다고 말할 때, 우리는 엔진에 대한 그의 전문 지식 때문에 경청하는 것은 아니다. 우리는 그의 재능을 존경하기 때문에 경청한다. 탁월함이 연결된다. 만약 당신이 어떤 분야에서 높은 수준의 능력을 갖고 있다면, 다른 사람들은 그것 때문에 당신과 연결되기를 원할 수도 있다.`},
{u:13,n:13,k:'과제에 필요한 시간 파악과 배치',t:'Know How Long Your Tasks Will Take',x:['Put Your Leisure Time First','Why Failures Are Meaningful in Life'],w:[['Over-optimism','Pessimism'],['estimating','ignoring'],['significant','small'],['short','long'],['longer','shorter']],
en:`If you want the confidence that comes from achieving what you set out to do each day, then it’s important to understand how long things are going to take. Over-optimism about what can be achieved within a certain time frame is a problem. So work on it. Make a practice of estimating the amount of time needed alongside items on your ‘things to do’ list, and learn by experience when tasks take a greater or lesser time than expected. Give attention also to fitting the task to the available time. There are some tasks that you can only set about if you have a significant amount of time available. There is no point in trying to gear up for such a task when you only have a short period available. So schedule the time you need for the longer tasks and put the short tasks into the spare moments in between.`,
ko:`만약 매일 하고자 착수하는 일을 성취함으로써 얻게 되는 자신감을 원한다면, 일이 얼마나 시간이 걸릴지 아는 것이 중요하다. 어떤 특정 기간 내에 성취될 수 있는 것에 대한 지나친 낙관주의는 문제이다. 그러므로 그것을 개선하려고 노력하라. ‘해야 할 일’ 목록에 있는 항목과 함께, 필요한 시간의 양을 추산하는 것을 습관화하고, 과제가 언제 예상보다 더 많은 시간 또는 더 적은 시간이 걸리는지 경험을 통해 배우라. 그 이용 가능한 시간에 과제를 맞추는 것에도 또한 주의를 기울이라. 이용할 수 있는 시간의 양이 상당히 있어야만 시작할 수 있는 몇몇 과제가 있다. 이용할 수 있는 시간이 짧은 시간밖에 없을 때 그런 과제를 위해 준비를 갖추려고 애쓰는 것은 무의미하다. 그러므로 시간이 더 오래 걸리는 과제를 위해 필요한 시간을 계획하고, 그 사이의 남는 시간에 시간이 짧게 걸리는 과제를 배치하라.`},
{u:13,n:15,k:'우리의 판단력을 빼앗는 로봇',t:'Robots Are Taking Our Judgment',x:['Warehouse Software Makes Workers Happier','Robots Will Create More Jobs Than They Take'],w:[['judgment','salaries'],['minimise','increase'],['maximise','reduce'],['reduces','raises'],['inexpensive','valuable']],
en:`We worry that the robots are taking our jobs, but just as common a problem is that the robots are taking our judgment. In the large warehouses so common behind the scenes of today’s economy, human ‘pickers’ hurry around grabbing products off shelves and moving them to where they can be packed and dispatched. In their ears are headpieces: the voice of ‘Jennifer’, a piece of software, tells them where to go and what to do, controlling the smallest details of their movements. Jennifer breaks down instructions into tiny chunks, to minimise error and maximise productivity — for example, rather than picking eighteen copies of a book off a shelf, the human worker would be politely instructed to pick five. Then another five. Then yet another five. Then another three. Working in such conditions reduces people to machines made of flesh. Rather than asking us to think or adapt, the Jennifer unit takes over the thought process and treats workers as an inexpensive source of some visual processing and a pair of opposable thumbs.`,
ko:`우리는 로봇이 우리의 직업을 빼앗고 있다고 걱정하지만, 그만큼 흔한 문제는 로봇이 우리의 판단력을 빼앗고 있다는 것이다. 오늘날의 경제 배후에서는 아주 흔한 거대한 창고에서 인간 ‘집게’는 서둘러서 선반에서 상품을 집어내고 그것들이 포장되고 발송될 수 있는 곳으로 이동시킨다. 그들의 귀에는 헤드폰이 있는데, 한 소프트웨어 프로그램인 ‘Jennifer’의 목소리가 그들의 움직임의 가장 작은 세부 사항들을 조종하면서, 그들에게 어디로 갈지와 무엇을 할지를 말한다. Jennifer는 실수를 줄이고 생산성을 최대화하기 위해 지시 사항을 아주 작은 덩어리로 쪼갠다. 예를 들어, 인간 작업자는 선반에서 책 18권을 집어내기보다는, 5권을 집어내라고 정중하게 지시받을 것이다. 그러고 나서 또 다른 5권을. 그러고 나서 다시 또 다른 5권을. 그러고 나서 또 다른 3권을. 그러한 조건에서 일하는 것은 사람을 살로 만들어진 기계로 격하시킨다. 우리에게 생각하거나 적응하라고 요구하기보다는, Jennifer라는 장치는 사고 과정을 가져가고 작업자들을 약간의 시각적인 처리 과정과 한 쌍의 마주 볼 수 있는 엄지손가락을 가진 값싼 자원으로 취급한다.`}
];

const UNITS=[{u:3,name:'필자의 주장'},{u:11,name:'어법'},{u:4,name:'함축 의미'},{u:12,name:'어휘'},{u:6,name:'주제'},{u:13,name:'빈칸 추론'}];
const TYPES=[{k:'order',name:'순서 배열'},{k:'insert',name:'문장 삽입'},{k:'irr',name:'무관한 문장'},{k:'title',name:'제목'},{k:'word',name:'어휘 이지선다'}];
const TN=Object.fromEntries(TYPES.map(t=>[t.k,t.name]));
const CIRC=['①','②','③','④','⑤'];

function splitS(t){
  const out=[];const re=/([.!?][”’"]?)\s+(?=[A-Z“‘"(])/g;let last=0,m;
  while((m=re.exec(t))){const end=m.index+m[1].length;const piece=t.slice(last,end);
    if(/\b[A-Z]\.$/.test(piece))continue;out.push(piece.trim());last=re.lastIndex;}
  out.push(t.slice(last).trim());return out.filter(Boolean);
}
P.forEach(p=>{p.id=p.u+'-'+p.n;p.s=splitS(p.en);});

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let stats=store.get('oly-stats',{});
let memo=store.get('oly-memo',{});
let cfg=store.get('oly-cfg',{types:TYPES.map(t=>t.k),units:UNITS.map(u=>u.u),weak:true});
let st={view:'home',cur:null,mode:'full',hidePct:40,seed:1,revealAll:false,quiz:null};

const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const koBox=p=>`<details><summary>해석 보기</summary><p class="ko">${esc(p.ko)}</p></details>`;

const GEN={
order(p){
  const s=p.s,n=s.length;if(n<4)return null;
  const intro=n>=9?ri(1,2):1;const rest=s.slice(intro),m=rest.length;if(m<3)return null;
  const b=m/3;
  const c1=Math.max(1,Math.min(m-2,Math.round(b)+ri(-1,1)));
  const c2=Math.max(c1+1,Math.min(m-1,Math.round(2*b)+ri(-1,1)));
  const ch=[rest.slice(0,c1),rest.slice(c1,c2),rest.slice(c2)];
  const perms=['ACB','BAC','BCA','CAB','CBA'];const a=ri(0,4);const ord=perms[a];
  const lab={};for(let i=0;i<3;i++)lab[ord[i]]=ch[i];
  const introT=esc(s.slice(0,intro).join(' '));
  const body=`<p class="given">${introT}</p>`+['A','B','C'].map(L=>`<p><span class="tag">(${L})</span> ${esc(lab[L].join(' '))}</p>`).join('');
  const opts=perms.map(x=>`(${x[0]}) – (${x[1]}) – (${x[2]})`);
  const explain=`<p class="exh">바른 순서: ${ord.split('').map(x=>'('+x+')').join(' – ')}</p><div class="psg"><p>${introT}${ord.split('').map(L=>` <span class="tag">(${L})</span> ${esc(lab[L].join(' '))}`).join('')}</p></div>`+koBox(p);
  return {prompt:'주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?',body,opts,ans:a,explain};
},
insert(p){
  const s=p.s,n=s.length;if(n<5)return null;
  const k=ri(1,n-1);const ins=s[k];const r=s.filter((_,i)=>i!==k);
  const G=n-1;const w=Math.min(5,G);let start=k-ri(0,w-1);start=Math.max(1,Math.min(G-w+1,start));
  let h=`<p class="given">${esc(ins)}</p><p>${esc(r.slice(0,start).join(' '))}`;
  for(let i=0;i<w;i++){h+=` <span class="slot">( ${CIRC[i]} )</span> `;if(r[start+i]!==undefined)h+=esc(r[start+i]);}
  const tail=r.slice(start+w);if(tail.length)h+=' '+esc(tail.join(' '));h+='</p>';
  const explain=`<div class="psg"><p>${esc(s.slice(0,k).join(' '))} <span class="hl">${esc(ins)}</span> ${esc(s.slice(k+1).join(' '))}</p></div>`+koBox(p);
  return {prompt:'글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?',body:h,opts:CIRC.slice(0,w),ans:k-start,explain};
},
irr(p){
  const s=p.s,n=s.length;if(n<5)return null;
  const start=ri(1,n-4);const f=ri(0,4);
  const others=P.filter(q=>q!==p);let fs=null,src=null;
  for(let i=0;i<40;i++){const q=pick(others);const c=pick(q.s.slice(1));if(c.length>=45&&c.length<=230){fs=c;src=q;break}}
  if(!fs)return null;
  const nums=s.slice(start,start+4);nums.splice(f,0,fs);
  const pre=esc(s.slice(0,start).join(' '));const post=esc(s.slice(start+4).join(' '));
  const body=`<p>${pre} ${nums.map((x,i)=>`<span class="slot">${CIRC[i]}</span> ${esc(x)}`).join(' ')} ${post}</p>`;
  const explain=`<p class="exh">${CIRC[f]}번은 ${src.u}강 ${src.n}번 지문(${src.k})의 문장이에요.</p><div class="psg"><p>${pre} ${nums.map((x,i)=>i===f?`<span class="strike">${CIRC[i]} ${esc(x)}</span>`:`<span class="slot">${CIRC[i]}</span> ${esc(x)}`).join(' ')} ${post}</p></div>`+koBox(p);
  return {prompt:'다음 글에서 전체 흐름과 관계 없는 문장은?',body,opts:CIRC.slice(),ans:f,explain};
},
title(p){
  const others=shuffle(P.filter(q=>q!==p)).slice(0,2).map(q=>q.t);
  const opts=shuffle([p.t,...p.x,...others]);
  const body=`<p>${esc(p.en)}</p>`;
  const explain=`<p class="exh enl">${esc(p.t)}</p><p class="muted">소재: ${p.k}</p>`+koBox(p);
  return {prompt:'다음 글의 제목으로 가장 적절한 것은?',body,opts:opts.map(esc),ans:opts.indexOf(p.t),explain,en:true};
},
word(p){
  let found=[];
  p.w.forEach(([c,x])=>{const m=new RegExp('\\b'+c+'\\b').exec(p.en);if(m)found.push({c,x,i:m.index,len:c.length});});
  found=shuffle(found);const sel=[];
  for(const o of found){if(sel.length>=3)break;if(sel.some(q=>Math.abs(q.i-o.i)<Math.max(q.len,o.len)+2))continue;sel.push(o);}
  if(sel.length<2)return null;
  sel.sort((a,b)=>a.i-b.i);const L=['A','B','C'];const k=sel.length;
  sel.forEach(o=>{o.flip=Math.random()<.5;o.first=o.flip?o.x:o.c;o.second=o.flip?o.c:o.x;});
  let h='',ex='',pos=0;
  sel.forEach((o,j)=>{const seg=esc(p.en.slice(pos,o.i));h+=seg;ex+=seg;h+=`<span class="pair">(${L[j]}) [${esc(o.first)} / ${esc(o.second)}]</span>`;ex+=`<span class="hl">${esc(o.c)}</span>`;pos=o.i+o.len;});
  h+=esc(p.en.slice(pos));ex+=esc(p.en.slice(pos));
  const full=(1<<k)-1;const masks=[];for(let m=0;m<=full;m++)if(m!==full)masks.push(m);
  let chosen=[full,...shuffle(masks).slice(0,Math.min(4,masks.length))];
  const key=m=>sel.map((o,j)=>{const w=((m>>j)&1)?o.c:o.x;return w===o.first?0:1}).join('');
  chosen.sort((a,b)=>key(a)<key(b)?-1:1);
  const opts=chosen.map(m=>`<span class="combo" style="--k:${k}">${sel.map((o,j)=>`<span>${esc(((m>>j)&1)?o.c:o.x)}</span>`).join('')}</span>`);
  const head=`<div class="opt headrow"><span class="cn"></span><span class="combo" style="--k:${k}">${sel.map((_,j)=>`<span>(${L[j]})</span>`).join('')}</span></div>`;
  const explain=`<p class="exh">${sel.map((o,j)=>`(${L[j]}) ${esc(o.c)}`).join(', ')}</p><div class="psg"><p>${ex}</p></div>`+koBox(p);
  return {prompt:`${L.slice(0,k).map(x=>'('+x+')').join(', ')}의 각 네모 안에서 문맥에 맞는 낱말로 가장 적절한 것은?`,body:`<p>${h}</p>`,opts,ans:chosen.indexOf(full),explain,head};
}
};

function weightedPick(pool){
  if(!cfg.weak||pool.length<2)return pick(pool);
  const ws=pool.map(p=>{const s=stats[p.id];return 1+(s&&s.t?(s.t-s.c)/s.t*3:.6)});
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i]}return pool[pool.length-1];
}
function nextQ(){
  const z=st.quiz;
  for(let t=0;t<40;t++){
    const p=weightedPick(z.pool);if(z.pool.length>1&&p===z.last)continue;
    const type=pick(z.types);const q=GEN[type](p);
    if(q){q.p=p;q.type=type;z.q=q;z.last=p;z.done=false;z.pick=null;return}
  }
  const p=z.pool[0];const q=GEN.title(p);q.p=p;q.type='title';z.q=q;z.done=false;z.pick=null;
}

const app=document.getElementById('app');
function render(){
  if(st.view==='home')renderHome();else if(st.view==='study')renderStudy();else renderQuiz();
}
function renderHome(){
  const tot=Object.values(stats).reduce((a,s)=>({c:a.c+s.c,t:a.t+s.t}),{c:0,t:0});
  const memoN=P.filter(p=>memo[p.id]).length;
  let h=`<header class="hero"><h1>올림포스 지문 암기</h1><p class="sub">김포고 1학년, 3·4·6·11·12·13강 홀수 지문 ${P.length}개</p>
  <div class="stats"><span>외운 지문<b>${memoN}/${P.length}</b></span><span>푼 문제<b>${tot.t}</b></span>${tot.t?`<span>정답률<b>${Math.round(tot.c/tot.t*100)}%</b></span>`:''}</div></header>`;
  h+=`<section class="panel"><h2>문제 풀기</h2><p class="sub">문제는 풀 때마다 새로 만들어져서 끝없이 나와요.</p>
  <p class="lbl">문제 유형</p><div class="chips">${TYPES.map(t=>`<button class="chip" data-act="type" data-k="${t.k}" aria-pressed="${cfg.types.includes(t.k)}">${t.name}</button>`).join('')}</div>
  <p class="lbl">범위</p><div class="chips">${UNITS.map(u=>`<button class="chip" data-act="unit" data-u="${u.u}" aria-pressed="${cfg.units.includes(u.u)}">${u.u}강</button>`).join('')}</div>
  <label class="tog"><input type="checkbox" data-act="weak" ${cfg.weak?'checked':''}>자주 틀린 지문을 더 자주 내기</label>
  <button class="btn" data-act="start" ${(!cfg.types.length||!cfg.units.length)?'disabled':''}>문제 풀기 시작</button></section>`;
  UNITS.forEach(u=>{
    h+=`<section class="unit"><h3>${u.u}강<span>${u.name}</span></h3>`;
    P.filter(p=>p.u===u.u).forEach(p=>{const s=stats[p.id];
      h+=`<button class="row${memo[p.id]?' done':''}" data-act="open" data-id="${p.id}"><span class="num">${p.n}</span><span><span class="k">${p.k}</span><span class="t">${esc(p.t)}</span></span><span class="acc">${memo[p.id]?'외움<br>':''}${s&&s.t?Math.round(s.c/s.t*100)+'%, '+s.t+'문제':''}</span></button>`;});
    h+='</section>';
  });
  h+=`<p style="margin-top:32px;text-align:center"><button class="link" data-act="reset">풀이 기록과 외움 표시 초기화</button></p>`;
  app.innerHTML=h;
}
function studyBody(p){
  if(st.mode==='full')return `<ol class="sents">${p.s.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
  if(st.mode==='ko')return `<p class="ko">${esc(p.ko)}</p>`;
  const rnd=mulberry(st.seed*997+P.indexOf(p));const keys=new Set(p.w.map(w=>w[0].toLowerCase()));const open=st.revealAll?' open':'';
  return `<ol class="sents">`+p.s.map(sen=>'<li>'+sen.split(/(\s+)/).map(tok=>{
    if(!tok||/^\s+$/.test(tok))return tok;
    const m=tok.match(/^([^A-Za-z0-9]*)(.*?)([^A-Za-z0-9]*)$/);const core=m[2];
    if(!core)return esc(tok);
    let hide;
    if(st.mode==='initial')hide=core.length>=2;
