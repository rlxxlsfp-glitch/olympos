    else{const r=rnd();hide=core.length>=2&&(st.hidePct===100||keys.has(core.toLowerCase())||(core.length>=3&&r<st.hidePct/100));}
    if(!hide)return esc(tok);
    const hid=st.mode==='initial'?`${esc(core[0])}<span class="blank" style="width:${((core.length-1)*.5).toFixed(2)}em"></span>`:`<span class="blank" style="width:${Math.max(1.4,core.length*.52).toFixed(2)}em"></span>`;
    return `${esc(m[1])}<span class="w${open}" role="button" tabindex="0"><span class="h">${hid}</span><span class="f">${esc(core)}</span></span>${esc(m[3])}`;
  }).join('')+'</li>').join('')+'</ol>';
}
function renderStudy(){
  const p=st.cur,i=P.indexOf(p);
  let h=`<div class="top"><button class="ghost" data-act="home">목록으로</button><span class="muted">${p.u}강 ${p.n}번</span></div>
  <h1 class="ph">${p.k}</h1><p class="t2">${esc(p.t)}</p>
  <div class="seg" role="group">${[['full','원문'],['initial','첫 글자'],['hide','가리기'],['ko','해석']].map(([k,n])=>`<button data-act="mode" data-k="${k}" aria-pressed="${st.mode===k}">${n}</button>`).join('')}</div>`;
  if(st.mode==='hide')h+=`<div class="chips sm">${[20,40,60,100].map(v=>`<button class="chip" data-act="pct" data-v="${v}" aria-pressed="${st.hidePct===v}">${v}% 가리기</button>`).join('')}<button class="chip" data-act="shuffle">다시 섞기</button></div>`;
  if(st.mode==='hide'||st.mode==='initial')h+=`<p class="hint">가려진 단어를 누르면 보여요. <button class="link" data-act="revealall">${st.revealAll?'다시 가리기':'전부 보기'}</button></p>`;
  h+=`<article class="panel${st.mode==='ko'?'':' psg'}">${studyBody(p)}</article>`;
  h+=`<div class="bar"><div class="in"><button class="ghost" data-act="prev" ${i===0?'disabled':''}>이전</button><button class="ghost${memo[p.id]?' on':''}" data-act="memo" aria-pressed="${!!memo[p.id]}">${memo[p.id]?'외웠어요 ✓':'외웠어요'}</button><button class="btn" data-act="quizone">이 지문 문제</button><button class="ghost" data-act="next" ${i===P.length-1?'disabled':''}>다음</button></div></div>`;
  app.innerHTML=h;
}
function renderQuiz(){
  const z=st.quiz,q=z.q;
  let h=`<div class="top"><button class="ghost" data-act="home">그만하기</button><span class="score">맞힌 문제 ${z.c} / ${z.t}</span></div>
  <div class="qhead"><span class="qtype">${TN[q.type]}</span><span>${z.done?`${q.p.u}강 ${q.p.n}번 지문`:(z.pool.length===1?`${q.p.u}강 ${q.p.n}번 지문`:'어느 지문일까요?')}</span></div>
  <p class="prompt">${q.prompt}</p><div class="psg">${q.body}</div>${q.head||''}
  <div class="opts">${q.opts.map((o,i)=>{let c='opt';if(z.done){if(i===q.ans)c+=' right';else if(i===z.pick)c+=' wrong';}
    return `<button class="${c}" data-act="pick" data-i="${i}" ${z.done?'disabled':''}><span class="cn">${CIRC[i]}</span><span class="${q.en?'en':''}">${q.type==='insert'||q.type==='irr'?'':o}</span></button>`}).join('')}</div>`;
  if(z.done){const ok=z.pick===q.ans;
    h+=`<section class="fb ${ok?'ok':'no'}" id="fb"><p class="res">${ok?'정답이에요':'아쉬워요. 정답은 '+CIRC[q.ans]+'번'}</p>${q.explain}<p style="margin:14px 0 0"><button class="link" data-act="openq">이 지문 외우러 가기</button></p></section>`;}
  h+=`<div class="bar"><div class="in"><button class="btn" data-act="nextq" ${z.done?'':'disabled'}>다음 문제</button></div></div>`;
  app.innerHTML=h;
}
function startQuiz(pool,types){st.quiz={pool,types,c:0,t:0,last:null};nextQ();st.view='quiz';render();window.scrollTo(0,0);}
function openStudy(p){st.cur=p;st.view='study';st.revealAll=false;render();window.scrollTo(0,0);}

document.addEventListener('click',e=>{
  const w=e.target.closest('.w');if(w){w.classList.toggle('open');return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;const z=st.quiz;
  switch(a){
    case 'type':{const k=el.dataset.k;cfg.types=cfg.types.includes(k)?cfg.types.filter(x=>x!==k):[...cfg.types,k];store.set('oly-cfg',cfg);render();break}
    case 'unit':{const u=+el.dataset.u;cfg.units=cfg.units.includes(u)?cfg.units.filter(x=>x!==u):[...cfg.units,u];store.set('oly-cfg',cfg);render();break}
    case 'weak':cfg.weak=el.checked;store.set('oly-cfg',cfg);break;
    case 'start':startQuiz(P.filter(p=>cfg.units.includes(p.u)),cfg.types.slice());break;
    case 'open':openStudy(P.find(p=>p.id===el.dataset.id));break;
    case 'home':st.view='home';render();window.scrollTo(0,0);break;
    case 'mode':st.mode=el.dataset.k;st.revealAll=false;render();break;
    case 'pct':st.hidePct=+el.dataset.v;st.revealAll=false;render();break;
    case 'shuffle':st.seed++;st.revealAll=false;render();break;
    case 'revealall':st.revealAll=!st.revealAll;render();break;
    case 'prev':{const i=P.indexOf(st.cur);if(i>0)openStudy(P[i-1]);break}
    case 'next':{const i=P.indexOf(st.cur);if(i<P.length-1)openStudy(P[i+1]);break}
    case 'memo':memo[st.cur.id]=!memo[st.cur.id];if(!memo[st.cur.id])delete memo[st.cur.id];store.set('oly-memo',memo);render();break;
    case 'quizone':startQuiz([st.cur],cfg.types.length?cfg.types.slice():TYPES.map(t=>t.k));break;
    case 'pick':{if(z.done)break;const i=+el.dataset.i;z.pick=i;z.done=true;z.t++;const ok=i===z.q.ans;if(ok)z.c++;
      const s=stats[z.q.p.id]||{c:0,t:0};s.t++;if(ok)s.c++;stats[z.q.p.id]=s;store.set('oly-stats',stats);render();
      const fb=document.getElementById('fb');if(fb)fb.scrollIntoView({block:'nearest'});break}
    case 'nextq':nextQ();render();window.scrollTo(0,0);break;
    case 'openq':openStudy(z.q.p);break;
    case 'reset':if(confirm('풀이 기록과 외움 표시를 모두 지울까요?')){stats={};memo={};store.set('oly-stats',stats);store.set('oly-memo',memo);render();}break;
  }
});
document.addEventListener('keydown',e=>{const w=e.target.closest&&e.target.closest('.w');if(w&&(e.key==='Enter'||e.key===' ')){e.preventDefault();w.classList.toggle('open')}});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
